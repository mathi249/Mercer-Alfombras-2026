# ============================================================
#  KEEP-ALIVE de Supabase (plan gratuito)
#  Hace una consulta mínima cada 12 horas para que Supabase
#  no pause el proyecto por inactividad. Consumo casi nulo.
#
#  REQUISITOS (configurar una sola vez en GitHub):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     SUPABASE_URL = https://TU-PROYECTO.supabase.co
#     SUPABASE_KEY = tu clave anon/publishable
# ============================================================
name: Keep Alive Supabase

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas (00:00 y 12:00 UTC)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a Supabase (SELECT 1 fila)
        run: |
          echo "Haciendo ping a Supabase para mantenerlo activo..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/alfombras?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}")
          echo "Código HTTP recibido: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "✅ Supabase respondió correctamente."
          else
            echo "⚠️ Respuesta inesperada ($HTTP). Revisar los secrets SUPABASE_URL / SUPABASE_KEY."
            exit 1
          fi
