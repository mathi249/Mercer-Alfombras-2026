/* ============================================================
   ACTIVIDAD DE STOCK  (solo Administrador1)
   Historial/auditoría de todos los movimientos de inventario,
   con valores anterior y nuevo. No se sobrescribe.
   ============================================================ */
function ActividadStockPanel({onAnular}){
  const [movs,setMovs]=useState([]); const [cargando,setCargando]=useState(true);
  const [fAccion,setFAccion]=useState(""); const [q,setQ]=useState("");
  const [confirmar,setConfirmar]=useState(null); const [procesando,setProcesando]=useState(false);
  const cargar=async()=>{
    setCargando(true);
    try{ const d=await api.list(TABLE_MOV); setMovs((d||[]).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""))); }catch(e){ setMovs([]); }
    setCargando(false);
  };
  useEffect(()=>{ cargar(); },[]);
  const acciones=[...new Set(movs.map(m=>m.accion).filter(Boolean))];
  const view=movs.filter(m=>
    (!fAccion || m.accion===fAccion) &&
    (!q || (m.producto||"").toLowerCase().includes(q.toLowerCase()) || (m.contenedor||"").toLowerCase().includes(q.toLowerCase()) || (m.usuario||"").toLowerCase().includes(q.toLowerCase()))
  ).slice(0,300);
  const colorAccion=(a)=>{
    if(a==="Venta") return "bg-emerald-100 text-emerald-800";
    if(a==="Anulación"||a==="Eliminación") return "bg-red-100 text-red-800";
    if(a==="Alta"||a==="Compra") return "bg-blue-100 text-blue-800";
    if(a==="Importación") return "bg-purple-100 text-purple-800";
    if(a==="Ajuste de Stock") return "bg-amber-100 text-amber-800";
    return "bg-sand-100 text-sand-700";
  };
  const fmtDif=(d)=> d===null||d===undefined?"—":(d>0?`+${d}`:`${d}`);
  const fmtCosto=(c)=> c===null||c===undefined?"—":"US$ "+fmt(c);
  // Un movimiento se puede anular si: afectó stock, no está ya anulado, y no es una reversión
  const anulable=(m)=> m.diferencia!==null && m.diferencia!==undefined && !m.anulado && m.accion!=="Anulación" && m.accion!=="Reversión";
  const doAnular=async()=>{
    if(!confirmar) return;
    setProcesando(true);
    const ok=await onAnular(confirmar);
    setProcesando(false);
    setConfirmar(null);
    if(ok) cargar(); // refrescar el historial
  };
  return (
    <div className="fade">
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div><h3 className="font-serif text-2xl text-ink mb-1">Actividad de Stock</h3>
        <p className="text-sm text-sand-600">Historial completo de movimientos de inventario. Del más reciente al más antiguo.</p></div>
        <div className="flex gap-2 flex-wrap">
          <input className="px-3 py-2 rounded-lg border border-sand-300 bg-white text-sm" placeholder="🔍 Producto, contenedor o usuario" value={q} onChange={e=>setQ(e.target.value)}/>
          <select className="px-3 py-2 rounded-lg border border-sand-300 bg-white text-sm" value={fAccion} onChange={e=>setFAccion(e.target.value)}>
            <option value="">Todas las acciones</option>
            {acciones.map(a=><option key={a}>{a}</option>)}
          </select>
          <button onClick={cargar} className="px-4 py-2 rounded-xl border border-sand-300 text-sm hover:bg-sand-100">↻</button>
        </div>
      </div>
      <div className="bg-white rounded-2xl border border-sand-200 shadow-sm overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-sand-100 border-b border-sand-200">
            <tr>
              {["Fecha y hora","Usuario","Acción","Producto","Contenedor","Stock ant.","Stock nuevo","Dif.","Costo ant.","Costo nuevo","Condición","Observaciones","Acción"].map(h=>
                <th key={h} className="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wider text-sand-600 whitespace-nowrap">{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {cargando ? <tr><td colSpan="13" className="text-center py-8 text-sand-500">Cargando…</td></tr> :
             view.length===0 ? <tr><td colSpan="13" className="text-center py-8 text-sand-500">Sin movimientos registrados aún</td></tr> :
             view.map(m=>(
              <tr key={m.id} className={"border-b border-sand-100 hover:bg-sand-50 "+(m.anulado?"opacity-50":"")}>
                <td className="px-3 py-2 whitespace-nowrap text-xs text-sand-600">{(m.fecha||"").replace("T"," ").slice(0,19)}</td>
                <td className="px-3 py-2 whitespace-nowrap">{m.usuario}</td>
                <td className="px-3 py-2 whitespace-nowrap"><span className={"px-2 py-0.5 rounded-full text-xs font-medium "+colorAccion(m.accion)}>{m.accion}</span></td>
                <td className="px-3 py-2">{m.producto}</td>
                <td className="px-3 py-2 whitespace-nowrap">{m.contenedor}</td>
                <td className="px-3 py-2 text-center">{m.stock_anterior===null?"—":m.stock_anterior}</td>
                <td className="px-3 py-2 text-center">{m.stock_nuevo===null?"—":m.stock_nuevo}</td>
                <td className={"px-3 py-2 text-center font-medium "+(m.diferencia>0?"text-emerald-700":m.diferencia<0?"text-red-600":"text-sand-500")}>{fmtDif(m.diferencia)}</td>
                <td className="px-3 py-2 whitespace-nowrap text-sand-600">{fmtCosto(m.costo_anterior)}</td>
                <td className="px-3 py-2 whitespace-nowrap text-sand-600">{fmtCosto(m.costo_nuevo)}</td>
                <td className="px-3 py-2 whitespace-nowrap text-xs">{m.condicion||"—"}</td>
                <td className="px-3 py-2 text-xs text-sand-600">{m.observaciones}</td>
                <td className="px-3 py-2 whitespace-nowrap text-right">
                  {m.anulado
                    ? <span className="text-xs text-red-500 font-medium">Anulado</span>
                    : anulable(m)
                      ? <button onClick={()=>setConfirmar(m)} className="text-xs px-3 py-1 rounded-lg border border-red-300 text-red-700 hover:bg-red-50">Anular</button>
                      : <span className="text-xs text-sand-400">—</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {view.length>=300 && <p className="text-xs text-sand-500 mt-2">Mostrando los 300 movimientos más recientes.</p>}

      {confirmar && (
        <Modal title="Confirmar anulación" onClose={()=>!procesando&&setConfirmar(null)}>
          <p className="text-sm text-ink mb-3">Vas a anular este movimiento y revertir su efecto en el stock:</p>
          <div className="bg-sand-50 rounded-xl p-3 border border-sand-200 text-sm mb-4">
            <div><b>{confirmar.accion}</b> · {confirmar.producto}</div>
            <div className="text-sand-600 mt-1">Diferencia original: {fmtDif(confirmar.diferencia)} unidades</div>
            <div className="text-sand-600">Al anular, el stock se ajustará en {confirmar.diferencia>0?`−${confirmar.diferencia}`:`+${Math.abs(confirmar.diferencia)}`} unidad(es).</div>
          </div>
          <p className="text-xs text-sand-500 mb-4">El movimiento no se borra: queda registrado como anulado para mantener la trazabilidad.</p>
          <div className="flex gap-3 justify-end">
            <button onClick={()=>setConfirmar(null)} disabled={procesando} className="px-4 py-2 rounded-xl border border-sand-300 text-sm hover:bg-sand-100 disabled:opacity-50">Cancelar</button>
            <button onClick={doAnular} disabled={procesando} className="px-4 py-2 rounded-xl bg-red-600 text-white text-sm font-semibold hover:bg-red-700 disabled:opacity-50">{procesando?"Anulando…":"Sí, anular"}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================================================
   INCIDENTES  (solo Administrador1)

   ============================================================ */
function IncidentesPanel({rows,ventas,cloud}){
  const [ayuda,setAyuda]=useState([]); const [errores,setErrores]=useState([]);
  const [cargando,setCargando]=useState(true);
  const cargar=async()=>{
    setCargando(true);
    try{
      const a=await api.list(TABLE_AYUDA); setAyuda((a||[]).sort((x,y)=>(y.fecha||"").localeCompare(x.fecha||"")));
      const l=await api.list(TABLE_LOGS); setErrores((l||[]).filter(x=>x.nivel==="error"||x.nivel==="warn").sort((x,y)=>(y.fecha||"").localeCompare(x.fecha||"")).slice(0,15));
    }catch(e){ setAyuda([]); setErrores([]); }
    setCargando(false);
  };
  useEffect(()=>{ cargar(); },[]);
  const cambiarEstado=async(m,estado)=>{
    try{ await api.update(m.id,{estado},TABLE_AYUDA); setAyuda(as=>as.map(x=>x.id===m.id?{...x,estado}:x)); }catch(e){}
  };
  // Determinar semáforo
  const erroresRecientes=errores.filter(e=>e.nivel==="error").length;
  const advertencias=errores.filter(e=>e.nivel==="warn").length;
  const pendientes=ayuda.filter(a=>a.estado==="Pendiente").length;
  const sinConexion=!cloud;
  let semaforo, color, texto;
  if(sinConexion || erroresRecientes>0){ semaforo="🔴"; color="bg-red-600"; texto="Hay errores que requieren atención"; }
  else if(advertencias>0 || pendientes>0){ semaforo="🟡"; color="bg-amber-500"; texto="Hay advertencias o mensajes pendientes"; }
  else { semaforo="🟢"; color="bg-emerald-700"; texto="Funcionamiento óptimo"; }

  return (
    <div className="fade">
      <div className="flex items-center justify-between mb-5">
        <h3 className="font-serif text-2xl text-ink">Incidentes</h3>
        <button onClick={cargar} className="px-4 py-2 rounded-xl border border-sand-300 text-sm hover:bg-sand-100">↻ Actualizar</button>
      </div>
      <div className={"rounded-2xl p-6 mb-6 text-white "+color}>
        <div className="text-2xl font-semibold">{semaforo} {texto}</div>
        <div className="text-sm opacity-90 mt-2 flex flex-wrap gap-4">
          <span>Conexión: {cloud?"Nube activa":"Modo local"}</span>
          <span>Errores: {erroresRecientes}</span>
          <span>Advertencias: {advertencias}</span>
          <span>Mensajes pendientes: {pendientes}</span>
        </div>
      </div>

      <h4 className="font-serif text-lg text-ink mb-3">Mensajes de los usuarios (desde Ayuda)</h4>
      <div className="bg-white rounded-2xl border border-sand-200 shadow-sm overflow-x-auto mb-6">
        <table className="w-full text-sm">
          <thead className="bg-sand-100 border-b border-sand-200"><tr>
            {["Fecha","Usuario","Tipo","Comentario","Estado","Acción"].map(h=><th key={h} className="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wider text-sand-600 whitespace-nowrap">{h}</th>)}
          </tr></thead>
          <tbody>
            {cargando ? <tr><td colSpan="6" className="text-center py-8 text-sand-500">Cargando…</td></tr> :
             ayuda.length===0 ? <tr><td colSpan="6" className="text-center py-8 text-sand-500">No hay mensajes</td></tr> :
             ayuda.map(m=>(
              <tr key={m.id} className="border-b border-sand-100 hover:bg-sand-50">
                <td className="px-3 py-2 whitespace-nowrap text-xs text-sand-600">{(m.fecha||"").slice(0,10)}</td>
                <td className="px-3 py-2 whitespace-nowrap">{m.usuario}</td>
                <td className="px-3 py-2 whitespace-nowrap">{m.tipo}</td>
                <td className="px-3 py-2">{m.comentario}</td>
                <td className="px-3 py-2"><span className={"px-2 py-0.5 rounded-full text-xs font-medium "+(m.estado==="Resuelto"?"bg-emerald-100 text-emerald-800":m.estado==="En revisión"?"bg-amber-100 text-amber-800":"bg-sand-100 text-sand-700")}>{m.estado}</span></td>
                <td className="px-3 py-2 whitespace-nowrap">
                  <select className="text-xs border border-sand-300 rounded-lg px-2 py-1 bg-white" value={m.estado} onChange={e=>cambiarEstado(m,e.target.value)}>
                    <option>Pendiente</option><option>En revisión</option><option>Resuelto</option>
                  </select>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h4 className="font-serif text-lg text-ink mb-3">Últimos errores y advertencias del sistema</h4>
      <div className="bg-white rounded-2xl border border-sand-200 shadow-sm overflow-hidden">
        {errores.length===0 ? <div className="text-center py-8 text-sand-500 text-sm">Sin errores registrados 🎉</div> :
         errores.map(e=>(
          <div key={e.id} className="px-4 py-3 border-b border-sand-100 last:border-0 flex items-start gap-3">
            <span>{e.nivel==="error"?"🔴":"🟡"}</span>
            <div className="text-sm"><span className="text-xs text-sand-500">{(e.fecha||"").replace("T"," ").slice(0,19)} · {e.usuario} · {e.tipo}</span><div className="text-ink">{e.detalle}</div></div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [user,setUser]=useState(null);
  const [rows,setRows]=useState([]);
  const [tab,setTab]=useState("dash");
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [editing,setEditing]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [confirm,setConfirm]=useState(null);
  const [ventas,setVentas]=useState([]);
  const [showVentaForm,setShowVentaForm]=useState(false);
  const [editingVenta,setEditingVenta]=useState(null);
  const [confirmVenta,setConfirmVenta]=useState(null);
  const [motivoAnul,setMotivoAnul]=useState("");
  const [reintegrar,setReintegrar]=useState(true);
  const [confirmDelVenta,setConfirmDelVenta]=useState(null);
  const fileRef=useRef();
  const notify=(msg,type="ok")=>setToast({msg,type});

  const load=async()=>{
    setLoading(true);
    try{
      let data=await api.list(TABLE);
      if(CLOUD && (!data || data.length===0)){
        // primera vez en la nube: sembrar stock en un solo request (lote)
        notify("Cargando stock inicial de Mercer en la nube…");
        await api.createMany(SEED,TABLE);
        data=await api.list(TABLE);
      }
      setRows(data||[]);
      const v=await api.list(TABLE_V);
      setVentas(v||[]);
      if(CLOUD && data && data.length) notify(`Conectado a la nube · ${data.length} productos`);
    }catch(e){ notify("No se pudo leer la nube: "+e.message,"error"); logEvent("error","Error de conexión al cargar datos: "+e.message,"error"); }
    setLoading(false);
  };
  useEffect(()=>{ if(user) load(); },[user]);

  // Resembrado manual: sube las 149 alfombras del archivo Mercer si faltan (no duplica las que ya existen por código)
  // Sincronización tiempo real: polling cada 8s en modo nube (stock + ventas)
  useEffect(()=>{
    if(!user || !CLOUD) return;
    const t=setInterval(async()=>{
      try{
        const [d,v]=await Promise.all([api.list(TABLE),api.list(TABLE_V)]);
        setRows(d||[]); setVentas(v||[]);
      }catch(e){}
    },8000);
    return ()=>clearInterval(t);
  },[user]);

  const containers=[...new Set(rows.map(r=>r.contenedor).filter(Boolean))].sort();

  const save=async(f)=>{
    try{
      if(editing){
        // El stock solo lo puede editar a mano Administrador1 (super). Para el resto se conserva.
        const nuevoStock = isSuper ? (Number(f.stock)||0) : editing.stock;
        const fe={...f, stock: nuevoStock};
        const u=await api.update(editing.id,fe,TABLE); setRows(rs=>rs.map(r=>r.id===editing.id?u:r)); notify("Alfombra actualizada"); logEvent("modif_producto",`${fe.codigo} · ${fe.nombre}`,"info");
        const cambioStock = nuevoStock!==editing.stock;
        if(cambioStock || editing.precio_compra!==fe.precio_compra || editing.contenedor!==fe.contenedor){
          logMovimiento({accion: cambioStock?"Ajuste de Stock":"Edición",producto:`${fe.codigo} · ${fe.nombre}`,contenedor:fe.contenedor,
            stock_anterior:editing.stock,stock_nuevo:nuevoStock,costo_anterior:editing.precio_compra,costo_nuevo:fe.precio_compra,
            observaciones: cambioStock?`Ajuste manual de stock por Administrador (${editing.stock} → ${nuevoStock})`:(editing.contenedor!==fe.contenedor?`Cambio de contenedor: ${editing.contenedor} → ${fe.contenedor}`:"Edición de datos")});
        }
      }
      else {
        const n=await api.create(f,TABLE); setRows(rs=>[...rs,n]); notify("Alfombra agregada"); logEvent("alta_producto",`${f.codigo} · ${f.nombre}`,"info");
        logMovimiento({accion:"Alta",producto:`${f.codigo} · ${f.nombre}`,contenedor:f.contenedor,producto_id:n.id,
          stock_anterior:0,stock_nuevo:f.stock,costo_anterior:null,costo_nuevo:f.precio_compra,observaciones:"Alta de producto"});
      }
      setShowForm(false); setEditing(null);
    }catch(e){ notify(e.message,"error"); }
  };

  // ---- ANULAR / REVERTIR un movimiento de stock (reversión contable) ----
  const anularMovimiento=async(mov)=>{
    // Validaciones: no anular dos veces, no anular una anulación
    if(mov.anulado){ notify("Ese movimiento ya fue anulado","warn"); return; }
    if(mov.accion==="Anulación" || mov.accion==="Reversión"){ notify("No se puede anular una reversión","warn"); return; }
    // Buscar el producto: por producto_id si existe, si no por el código dentro del texto "producto"
    let prod = mov.producto_id ? rows.find(r=>r.id===mov.producto_id) : null;
    if(!prod){
      const cod=(mov.producto||"").split(" · ")[0].trim();
      prod = rows.find(r=>r.codigo===cod);
    }
    // La diferencia original: cuánto sumó/restó ese movimiento al stock
    const dif = (mov.stock_anterior!=null && mov.stock_nuevo!=null) ? (Number(mov.stock_nuevo)-Number(mov.stock_anterior)) : null;
    if(dif===null){ notify("Ese movimiento no afectó el stock, no hay nada que revertir","warn"); return; }
    try{
      let stockAnt=null, stockNuevo=null;
      if(prod){
        stockAnt=Number(prod.stock)||0;
        stockNuevo=Math.max(0, stockAnt - dif);   // revierte: si sumó 20, resta 20; si restó 8, suma 8
        const up=await api.update(prod.id,{stock:stockNuevo},TABLE);
        setRows(rs=>rs.map(r=>r.id===prod.id?up:r));
      } else {
        notify("Producto no encontrado en stock; se marca la anulación igual","warn");
      }
      // Marcar el movimiento original como anulado (no se borra: trazabilidad)
      await api.update(mov.id,{anulado:true},TABLE_MOV);
      // Registrar el movimiento de reversión
      await logMovimiento({
        accion:"Anulación",
        producto:mov.producto, contenedor:mov.contenedor, producto_id:prod?prod.id:null,
        stock_anterior:stockAnt, stock_nuevo:stockNuevo,
        costo_anterior:null, costo_nuevo:null,
        revierte_id:mov.id,
        observaciones:`Reversión del movimiento #${mov.id} (${mov.accion}, dif ${dif>0?"+":""}${dif})`
      });
      logEvent("anular_movimiento",`Revertido mov #${mov.id} · ${mov.producto}`,"warn");
      notify(`Movimiento anulado · stock revertido${prod?` a ${stockNuevo}`:""}`,"warn");
      return true;
    }catch(e){ notify("Error al anular: "+e.message,"error"); return false; }
  };
  const changeStock=async(r,delta)=>{
    const ns=Math.max(0,(Number(r.stock)||0)+delta);
    try{
      const u=await api.update(r.id,{stock:ns},TABLE); setRows(rs=>rs.map(x=>x.id===r.id?u:x));
      logMovimiento({accion:"Ajuste de Stock",producto:`${r.codigo} · ${r.nombre}`,contenedor:r.contenedor,
        stock_anterior:r.stock,stock_nuevo:ns,costo_anterior:r.precio_compra,costo_nuevo:r.precio_compra,
        observaciones:`Ajuste manual (${delta>0?"+":""}${delta})`});
    }
    catch(e){ notify(e.message,"error"); }
  };
  const doDelete=async()=>{
    try{
      await api.remove(confirm.id,TABLE); setRows(rs=>rs.filter(r=>r.id!==confirm.id)); notify("Alfombra eliminada","warn"); logEvent("baja_producto",`${confirm.codigo} · ${confirm.nombre}`,"warn");
      logMovimiento({accion:"Eliminación",producto:`${confirm.codigo} · ${confirm.nombre}`,contenedor:confirm.contenedor,
        stock_anterior:confirm.stock,stock_nuevo:0,costo_anterior:confirm.precio_compra,costo_nuevo:null,observaciones:"Producto eliminado"});
    }
    catch(e){ notify(e.message,"error"); }
    setConfirm(null);
  };

  // ---- VENTAS ----
  // Descuenta stock de UNA venta ya creada (o avisa si no puede). Devuelve true si ok.
  const procesarStockVenta=async(f,ventaId)=>{
    if(f.condicion===CONDICION_SIN_DESCUENTO){
      logEvent("venta_consignacion",`${f.producto} · ${f.cantidad}u · ${f.cliente||""}`,"info");
      return true;
    }
    const prod = (f.producto_id && rows.find(r=>r.id===f.producto_id))
               || rows.find(r=>r.nombre===f.producto)
               || rows.find(r=>r.codigo===f.modelo);
    if(prod){
      const disp=Number(prod.stock)||0;
      const cant=Number(f.cantidad)||0;
      if(disp<=0 || cant>disp){
        notify(`⚠ Stock insuficiente de "${prod.nombre}" (hay ${disp}). Ese producto no se registró.`,"error");
        if(ventaId){ await api.remove(ventaId,TABLE_V); setVentas(vs=>vs.filter(x=>x.id!==ventaId)); }
        return false;
      }
      const ns=Math.max(0,disp-cant);
      const up=await api.update(prod.id,{stock:ns},TABLE);
      setRows(rs=>rs.map(r=>r.id===prod.id?up:r));
      logMovimiento({accion:"Venta",producto:`${prod.codigo} · ${prod.nombre}`,contenedor:prod.contenedor,producto_id:prod.id,
        stock_anterior:prod.stock,stock_nuevo:ns,costo_anterior:prod.precio_compra,costo_nuevo:prod.precio_compra,
        condicion:f.condicion||"",observaciones:`Venta ${f.cantidad}u · ${f.cliente||""}${f.canje?" · CANJE":""}`});
      logEvent("venta",`${f.producto} · ${f.cantidad}u · ${f.cliente||""}`,"info");
      return true;
    } else {
      notify(`⚠ "${f.producto}": venta guardada pero NO se descontó stock (producto no encontrado).`,"error");
      logEvent("error",`Venta sin descuento de stock: producto "${f.producto}" no encontrado`,"error");
      return true;
    }
  };

  const saveVenta=async(data)=>{
    try{
      // EDICIÓN: viene un objeto (una sola venta). Reajusta stock solo por la DIFERENCIA de cantidad.
      if(editingVenta && !Array.isArray(data)){
        const original=editingVenta;
        const u=await api.update(editingVenta.id,data,TABLE_V);
        setVentas(vs=>vs.map(v=>v.id===editingVenta.id?u:v));
        // Reajuste de stock: solo si la venta NO es consignación y cambió la cantidad del mismo producto
        const eraConsig = original.condicion===CONDICION_SIN_DESCUENTO;
        const esConsig = data.condicion===CONDICION_SIN_DESCUENTO;
        const mismoProducto = (data.producto_id && original.producto_id===data.producto_id) || (original.producto===data.producto);
        const difCant = (Number(data.cantidad)||0) - (Number(original.cantidad)||0);
        if(mismoProducto && !eraConsig && !esConsig && difCant!==0){
          const prod = (data.producto_id && rows.find(r=>r.id===data.producto_id)) || rows.find(r=>r.nombre===data.producto);
          if(prod){
            // Si ahora vende MÁS, descuenta la diferencia; si vende MENOS, la reintegra
            const ns=Math.max(0,(Number(prod.stock)||0)-difCant);
            const up=await api.update(prod.id,{stock:ns},TABLE);
            setRows(rs=>rs.map(r=>r.id===prod.id?up:r));
            logMovimiento({accion:"Ajuste de Stock",producto:`${prod.codigo} · ${prod.nombre}`,contenedor:prod.contenedor,producto_id:prod.id,
              stock_anterior:prod.stock,stock_nuevo:ns,costo_anterior:prod.precio_compra,costo_nuevo:prod.precio_compra,
              observaciones:`Edición de venta: cantidad ${original.cantidad}→${data.cantidad} (ajuste ${difCant>0?"-":"+"}${Math.abs(difCant)})`});
          }
        }
        notify("Venta actualizada");
        logEvent("modif_venta",`${data.producto} · ${data.cliente||""}`,"info");
        setShowVentaForm(false); setEditingVenta(null);
        return;
      }
      // ALTA: viene un ARRAY de ventas (uno o varios productos, comparten datos generales)
      const ventas = Array.isArray(data) ? data : [data];
      let okCount=0;
      for(const f of ventas){
        const n=await api.create(f,TABLE_V);
        setVentas(vs=>[...vs,n]);
        const ok=await procesarStockVenta(f,n.id);
        if(ok) okCount++;
      }
      if(okCount>0){
        notify(`${okCount} ${okCount===1?"producto registrado":"productos registrados"} en la venta`);
      }
      setShowVentaForm(false); setEditingVenta(null);
    }catch(e){ notify(e.message,"error"); logEvent("error","Error al guardar venta: "+e.message,"error"); }
  };
  const doAnularVenta=async()=>{
    try{
      const v=confirmVenta;
      const patch={ anulada:true, fecha_anulacion:new Date().toISOString().slice(0,10), motivo_anulacion:(motivoAnul||"").trim(), stock_reintegrado:reintegrar };
      const u=await api.update(v.id,patch,TABLE_V);
      setVentas(vs=>vs.map(x=>x.id===v.id?u:x));
      // Una venta en consignación nunca descontó stock, así que no hay nada que reintegrar
      const fueConsignacion = v.condicion===CONDICION_SIN_DESCUENTO;
      if(reintegrar && !fueConsignacion){
        // Reintegrar stock buscando por ID (confiable); fallback a nombre/código
        const prod = (v.producto_id && rows.find(r=>r.id===v.producto_id))
                   || rows.find(r=>r.nombre===v.producto)
                   || rows.find(r=>r.codigo===v.modelo);
        if(prod){
          const ns=(Number(prod.stock)||0)+(Number(v.cantidad)||0);
          const up=await api.update(prod.id,{stock:ns},TABLE);
          setRows(rs=>rs.map(r=>r.id===prod.id?up:r));
          notify(`Venta anulada · stock de "${prod.nombre}" reintegrado a ${ns}`,"warn");
          logMovimiento({accion:"Anulación",producto:`${prod.codigo} · ${prod.nombre}`,contenedor:prod.contenedor,producto_id:prod.id,
            stock_anterior:prod.stock,stock_nuevo:ns,costo_anterior:prod.precio_compra,costo_nuevo:prod.precio_compra,
            observaciones:`Anulación de venta · reintegro ${v.cantidad}u · ${(motivoAnul||"").trim()}`});
        } else {
          notify("⚠ Venta anulada pero NO se pudo reintegrar el stock (producto no encontrado)","error");
        }
      } else if(fueConsignacion){
        notify("Venta en consignación anulada (no afectaba stock)","warn");
        logEvent("anular_venta",`${v.producto} · consignación`,"warn");
      } else {
        notify("Venta anulada · stock NO reintegrado","warn");
        logEvent("anular_venta",`${v.producto} · sin reintegro`,"warn");
      }
    }catch(e){ notify(e.message,"error"); }
    setConfirmVenta(null); setMotivoAnul(""); setReintegrar(true);
  };
  const restaurarVenta=async(v)=>{
    try{
      const u=await api.update(v.id,{anulada:false,fecha_anulacion:null,motivo_anulacion:null},TABLE_V);
      setVentas(vs=>vs.map(x=>x.id===v.id?u:x));
      // Al restaurar, solo se descuenta stock si al anular se había reintegrado (para no descontar dos veces)
      if(v.stock_reintegrado!==false){
        const prod = rows.find(r=>r.nombre===v.producto) || rows.find(r=>r.codigo===v.modelo);
        if(prod){
          const ns=Math.max(0,(Number(prod.stock)||0)-(Number(v.cantidad)||0));
          const up=await api.update(prod.id,{stock:ns},TABLE);
          setRows(rs=>rs.map(r=>r.id===prod.id?up:r));
          notify(`Venta restaurada · stock de "${prod.nombre}" ahora: ${ns}`);
        } else {
          notify("Venta restaurada (producto no encontrado en stock)","warn");
        }
      } else {
        notify("Venta restaurada · stock sin cambios (no se había reintegrado al anular)");
      }
    }catch(e){ notify(e.message,"error"); }
  };
  const doDeleteVentaDef=async()=>{
    try{
      await api.remove(confirmDelVenta.id,TABLE_V);
      setVentas(vs=>vs.filter(x=>x.id!==confirmDelVenta.id));
      notify("Venta eliminada definitivamente","warn");
    }catch(e){ notify(e.message,"error"); }
    setConfirmDelVenta(null);
  };
  // Convierte a número limpiando símbolos de moneda, espacios y separadores de miles.
  // Ej: "$226.80" -> 226.80 · "1,234.50" -> 1234.50 · "US$ 43" -> 43
  const parseNumero=(v)=>{
    if(v===null||v===undefined||v==="") return 0;
    if(typeof v==="number") return isFinite(v)?v:0;
    let s=String(v).trim().replace(/\s/g,"").replace(/US\$|\$|ARS|USD/gi,"");
    // Si tiene coma Y punto: el último que aparece es el decimal, el otro es separador de miles
    if(s.includes(",")&&s.includes(".")){
      if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",","."); // formato europeo 1.234,50
      else s=s.replace(/,/g,""); // formato US 1,234.50
    }
    else if(s.includes(",")) s=s.replace(",","."); // solo coma = decimal
    s=s.replace(/[^0-9.\-]/g,"");
    const n=parseFloat(s);
    return isFinite(n)?n:0;
  };

  const importExcel=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"binary"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const data=XLSX.utils.sheet_to_json(sheet);
        // ---- Preparar registros con limpieza de números ----
        const recs=[];
        let costo0=0, formatoRaro=0, sinCodigo=0;
        for(const row of data){
          const rec={}; COLS.forEach(c=>{ if(row[c]!==undefined) rec[c]=row[c]; });
          if(!rec.codigo){ sinCodigo++; continue; }
          // Detectar si el costo venía con formato raro (texto con símbolos) antes de limpiar
          const costoOriginal=rec.precio_compra;
          if(costoOriginal!==undefined && typeof costoOriginal!=="number" && String(costoOriginal).replace(/[^0-9]/g,"")!=="" ) formatoRaro++;
          rec.stock=parseNumero(rec.stock);
          rec.precio_compra=parseNumero(rec.precio_compra);
          if(rec.precio_compra===0) costo0++;
          recs.push(rec);
        }
        // ---- Preview: confirmar antes de importar ----
        const nuevos=recs.filter(r=>!rows.find(x=>x.codigo===r.codigo)).length;
        const actualiza=recs.length-nuevos;
        const resumen=`Se van a importar ${recs.length} productos:\n`+
          `• ${actualiza} se actualizan (ya existen)\n`+
          `• ${nuevos} son nuevos\n`+
          `• ${costo0} quedarían con costo 0\n`+
          (formatoRaro>0?`• ${formatoRaro} tenían el costo con símbolos ($, comas): se corrigieron automáticamente\n`:"")+
          (sinCodigo>0?`• ${sinCodigo} filas sin código se ignoran\n`:"")+
          `\n¿Confirmás la importación?`;
        if(!window.confirm(resumen)){ notify("Importación cancelada","warn"); e.target.value=""; return; }
        // ---- Ejecutar ----
        let n=0;
        for(const rec of recs){
          const existing=rows.find(r=>r.codigo===rec.codigo);
          if(existing){
            await api.update(existing.id,rec,TABLE);
            logMovimiento({accion:"Importación",producto:`${rec.codigo} · ${rec.nombre||existing.nombre}`,contenedor:rec.contenedor||existing.contenedor,
              stock_anterior:existing.stock,stock_nuevo:rec.stock,costo_anterior:existing.precio_compra,costo_nuevo:rec.precio_compra,observaciones:"Actualizado por importación Excel"});
          } else {
            await api.create(rec,TABLE);
            logMovimiento({accion:"Importación",producto:`${rec.codigo} · ${rec.nombre||""}`,contenedor:rec.contenedor||"",
              stock_anterior:0,stock_nuevo:rec.stock,costo_anterior:null,costo_nuevo:rec.precio_compra,observaciones:"Alta por importación Excel"});
          }
          n++;
        }
        await load(); notify(`Importadas ${n} filas`);
        logEvent("importacion",`Importadas ${n} filas · ${nuevos} nuevas · ${costo0} con costo 0 · ${formatoRaro} costos corregidos`,"info");
      }catch(err){ notify("Error al importar: "+err.message,"error"); logEvent("error","Error al importar Excel: "+err.message,"error"); }
    };
    reader.readAsBinaryString(file);
    e.target.value="";
  };

  if(!user) return <Login onLogin={setUser}/>;

  const isSuper = user.role==="super";               // Administrador1: acceso total
  const isAdmin = user.role==="super" || user.role==="admin"; // puede operar (crear/editar/borrar)
  const opRole  = "admin";                            // rol que reciben los componentes de operación
  // Pestañas base (todos los usuarios operativos)
  const TABS=[["dash","Dashboard","📊"],["table","Inventario","📋"],["reports","Reportes","📈"],["compras","Compras","🛒"],["ventas","Ventas","🧾"],["anuladas","Ventas Anuladas","🚫"],["ventasdash","Dashboard Ventas","💹"],["ayuda","Ayuda","💬"]];
  // Pestañas exclusivas del Administrador1
  const TABS_SUPER=[["incidentes","Incidentes","🚦"],["actividad","Actividad de Stock","📦"],["health","Health Check","❤️"],["logs","Logs","📜"],["instructivos","Instructivos","📚"]];
  const visibleTabs = isSuper ? [...TABS, ...TABS_SUPER] : TABS;
  const btn="px-4 py-2 rounded-xl text-sm font-medium transition";
  // Las pestañas de export/import y acciones de stock solo tienen sentido en vistas de inventario/ventas
  const showActions = ["dash","table","reports","compras","ventas","anuladas","ventasdash"].includes(tab);

  return (
    <div className="min-h-screen">
      {toast && <Toast {...toast} onDone={()=>setToast(null)}/>}
      {/* Header */}
      <header className="bg-white border-b border-sand-200 sticky top-0 z-30">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-baseline gap-3">
            <span className="font-serif text-2xl font-bold tracking-widest text-ink">MERCER</span>
            <span className="text-[10px] uppercase tracking-[0.25em] text-sand-500 hidden sm:inline">Stock de Alfombras</span>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setTab("dash")} className="text-xs px-3 py-1.5 rounded-lg border border-sand-300 hover:bg-sand-100" title="Ir al inicio">🏠 <span className="hidden sm:inline">Home</span></button>
            <span className="text-xs text-sand-600 hidden sm:inline">{user.name} · {USERS[user.name]?.label||"Usuario"}</span>
            <span className="text-[10px]">{CLOUD?"☁":"💾"}</span>
            <button onClick={()=>{logEvent("logout","Cierre de sesión","info");setUser(null);setTab("dash");}} className="text-xs px-3 py-1.5 rounded-lg border border-sand-300 hover:bg-sand-100">Salir</button>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-6">
        {/* Nav + acciones */}
        <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
          <nav className="flex flex-wrap gap-2 bg-white p-1 rounded-2xl border border-sand-200">
            {visibleTabs.map(([k,l,i])=>(
              <button key={k} onClick={()=>setTab(k)} className={btn+(tab===k?" bg-ink text-white":" text-sand-700 hover:bg-sand-100")}>{i} <span className="hidden sm:inline">{l}</span></button>
            ))}
          </nav>
          <div className="flex flex-wrap gap-2">
            {isAdmin && showActions && <button onClick={()=>{setEditing(null);setShowForm(true);}} className="px-4 py-2 rounded-xl bg-ink text-white text-sm font-semibold hover:bg-sand-900">+ Compra</button>}
            {isAdmin && showActions && <button onClick={()=>{setEditingVenta(null);setShowVentaForm(true);}} className="px-4 py-2 rounded-xl bg-ink text-white text-sm font-semibold hover:bg-sand-900">+ Venta</button>}
            {showActions && <div className="flex gap-1">
              <button onClick={()=>exportExcel(rows)} className="px-3 py-2 rounded-xl border border-sand-300 text-sm hover:bg-sand-100" title="Excel">📗</button>
              <button onClick={()=>exportPDFContext(tab,{rows,ventas})} className="px-3 py-2 rounded-xl border border-sand-300 text-sm hover:bg-sand-100" title="Descargar PDF de esta vista">📕</button>
              {isAdmin && <button onClick={()=>fileRef.current.click()} className="px-3 py-2 rounded-xl border border-sand-300 text-sm hover:bg-sand-100" title="Importar Excel">📥</button>}
              <input ref={fileRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={importExcel}/>
            </div>}
          </div>
        </div>

        {loading ? <div className="text-center py-20 text-sand-500">Cargando datos…</div> : (
          <>
            {tab==="dash" && <Dashboard rows={rows}/>}
            {tab==="table" && <Table rows={rows} role={opRole} isSuper={isSuper} onEdit={(r)=>{setEditing(r);setShowForm(true);}} onDelete={(r)=>setConfirm(r)} onStock={changeStock}/>}
            {tab==="reports" && <Reports rows={rows}/>}
            {tab==="compras" && <Table rows={rows} role={opRole} onEdit={(r)=>{setEditing(r);setShowForm(true);}} onDelete={(r)=>setConfirm(r)}/>}
            {tab==="ventas" && <VentasPanel ventas={ventas} role={opRole} onNew={()=>{setEditingVenta(null);setShowVentaForm(true);}} onEdit={(v)=>{setEditingVenta(v);setShowVentaForm(true);}} onAnular={(v)=>{setMotivoAnul("");setConfirmVenta(v);}}/>}
            {tab==="anuladas" && <VentasAnuladasPanel ventas={ventas} role={opRole} onRestaurar={restaurarVenta} onEliminar={(v)=>setConfirmDelVenta(v)}/>}
            {tab==="ventasdash" && <VentasDashboard ventas={ventas}/>}
            {tab==="ayuda" && <AyudaPanel user={user} onNotify={notify}/>}
            {isSuper && tab==="incidentes" && <IncidentesPanel rows={rows} ventas={ventas} cloud={CLOUD}/>}
            {isSuper && tab==="actividad" && <ActividadStockPanel onAnular={anularMovimiento}/>}
            {isSuper && tab==="health" && <HealthPanel rows={rows} ventas={ventas} cloud={CLOUD}/>}
            {isSuper && tab==="logs" && <LogsPanel/>}
            {isSuper && tab==="instructivos" && <InstructivosPanel/>}
          </>
        )}
      </main>

      {showForm && <ProductForm initial={editing} onSave={save} onClose={()=>{setShowForm(false);setEditing(null);}} containers={containers} isSuper={isSuper} ubicacionesExistentes={[...new Set(rows.map(r=>normUbic(r.cliente)).filter(u=>u&&u!=="Depósito"))].sort()}/>}
      {showVentaForm && !editingVenta && <VentaForm initial={null} onSave={saveVenta} onClose={()=>{setShowVentaForm(false);setEditingVenta(null);}} productos={rows}/>}
      {showVentaForm && editingVenta && <VentaEditForm venta={editingVenta} onSave={saveVenta} onClose={()=>{setShowVentaForm(false);setEditingVenta(null);}} productos={rows}/>}

      {confirmVenta && (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4" onClick={()=>{setConfirmVenta(null);setMotivoAnul("");setReintegrar(true);}}>
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full fade" onClick={e=>e.stopPropagation()}>
            <h3 className="font-serif text-xl mb-2">¿Anular venta?</h3>
            <p className="text-sm text-sand-600 mb-3">Vas a anular la venta de <b>{confirmVenta.producto}</b> ({confirmVenta.fecha}). Quedará registrada en <b>Ventas Anuladas</b>.</p>
            <label className="block text-xs font-semibold text-sand-700 mb-1">¿Reintegrar el stock? ({confirmVenta.cantidad} u.)</label>
            <div className="flex gap-2 mb-4">
              <button onClick={()=>setReintegrar(true)} className={"flex-1 px-3 py-2 rounded-lg border text-sm font-medium "+(reintegrar?"bg-ink text-white border-ink":"border-sand-300 text-sand-700 hover:bg-sand-100")}>Sí, reintegrar</button>
              <button onClick={()=>setReintegrar(false)} className={"flex-1 px-3 py-2 rounded-lg border text-sm font-medium "+(!reintegrar?"bg-ink text-white border-ink":"border-sand-300 text-sand-700 hover:bg-sand-100")}>No reintegrar</button>
            </div>
            <label className="block text-xs font-semibold text-sand-700 mb-1">Motivo de anulación (opcional)</label>
            <input value={motivoAnul} onChange={e=>setMotivoAnul(e.target.value)} className="w-full mb-4 px-3 py-2 rounded-lg border border-sand-300 focus:border-sand-500 outline-none bg-sand-50 text-sm" placeholder="Ej: devolución, error de carga…"/>
            <div className="flex gap-3 justify-end">
              <button onClick={()=>{setConfirmVenta(null);setMotivoAnul("");setReintegrar(true);}} className="px-4 py-2 rounded-xl border border-sand-300 hover:bg-sand-100">Cancelar</button>
              <button onClick={doAnularVenta} className="px-5 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 font-semibold">Anular</button>
            </div>
          </div>
        </div>
      )}

      {confirmDelVenta && (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4" onClick={()=>setConfirmDelVenta(null)}>
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full fade" onClick={e=>e.stopPropagation()}>
            <h3 className="font-serif text-xl mb-2">¿Eliminar definitivamente?</h3>
            <p className="text-sm text-sand-600 mb-5">Vas a borrar para siempre la venta anulada de <b>{confirmDelVenta.producto}</b> ({confirmDelVenta.fecha}). Esta acción no se puede deshacer y no modifica el stock.</p>
            <div className="flex gap-3 justify-end">
              <button onClick={()=>setConfirmDelVenta(null)} className="px-4 py-2 rounded-xl border border-sand-300 hover:bg-sand-100">Cancelar</button>
              <button onClick={doDeleteVentaDef} className="px-5 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 font-semibold">Eliminar definitivo</button>
            </div>
          </div>
        </div>
      )}

      {confirm && (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4" onClick={()=>setConfirm(null)}>
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full fade" onClick={e=>e.stopPropagation()}>
            <h3 className="font-serif text-xl mb-2">¿Eliminar alfombra?</h3>
            <p className="text-sm text-sand-600 mb-5">Vas a eliminar <b>{confirm.codigo}</b> — {confirm.nombre}. Esta acción no se puede deshacer.</p>
            <div className="flex gap-3 justify-end">
              <button onClick={()=>setConfirm(null)} className="px-4 py-2 rounded-xl border border-sand-300 hover:bg-sand-100">Cancelar</button>
              <button onClick={doDelete} className="px-5 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 font-semibold">Eliminar</button>
            </div>
          </div>
        </div>
      )}
      <footer className="text-center text-[11px] text-sand-400 py-6">MERCER · Gestión de Stock · RDL Analytics</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
