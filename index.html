`MERCER · SISTEMA DE GESTIÓN — README PARA LOS DUEÑOS
====================================================

Qué es
------
Una aplicación web para administrar el negocio de alfombras: stock, compras,
ventas, reportes y ahora también monitoreo y soporte. Funciona desde el
celular, tablet o computadora, con un enlace. No hay que instalar nada.

Arquitectura (simple y sin costos)
----------------------------------
- GitHub: guarda el código.
- Vercel: publica la app y genera el enlace.
- Supabase: base de datos en la nube (guarda stock, ventas, logs y ayuda).
Todo en plan gratuito.

Qué se fue construyendo (historial)
-----------------------------------
1. Inventario de alfombras con dashboard, búsqueda, filtros y reportes.
2. Ventas con descuento automático de stock y ventas anuladas.
3. Sincronización en la nube (Supabase): todos ven lo mismo en tiempo real.
4. Mejoras de ventas: estado (cobrada/entregada), condición (mayorista/
   minorista con descuentos), factura, costo, margen, canje y teléfono.
5. Inventario: los productos con stock 0 se ocultan de todas las vistas
   (Dashboard, Reportes e Inventario) pero se conservan en la base para el
   historial. En Inventario, el filtro "Incluir Stock 0" permite verlos.
   "Precio" pasó a llamarse "Costo".
6. Consignación: alfombras entregadas a terceros, sumadas al stock.
7. Infraestructura: usuarios con permisos, Health Check, Incidentes, Ayuda,
   Logs, Instructivos y Keep-Alive automático.

Módulos principales
-------------------
- Dashboard: resumen de stock y valor de inventario.
- Inventario / Compras: alta, edición y control de productos.
- Ventas / Dashboard de Ventas / Ventas Anuladas.
- Reportes: stock por contenedor, por mes y top productos.
- Ayuda: para que cualquier usuario envíe consultas.
- Incidentes / Health / Logs / Instructivos: solo Administrador1.

El stock siempre se calcula como: Compras + Consignación − Ventas.` },

  { titulo:"Keep-Alive (mantener Supabase activo)", archivo:"02_keepalive.txt", texto:
`KEEP-ALIVE — MANTENER SUPABASE DESPIERTO
========================================

Problema
--------
El plan gratuito de Supabase pausa el proyecto si no recibe consultas durante
varios días. Si se pausa, la app deja de leer datos hasta reactivarlo a mano.

Solución
--------
Una tarea automática (GitHub Actions) hace una consulta mínima cada 12 horas.
Es un SELECT de 1 fila: consumo casi nulo, suficiente para mantenerlo activo.

Cómo está configurado
----------------------
En el repositorio de GitHub hay un archivo:
  .github/workflows/keepalive.yml
Ese archivo corre solo, dos veces por día, sin intervención.

Usa dos "secrets" de GitHub (Settings → Secrets and variables → Actions):
  - SUPABASE_URL : la URL del proyecto.
  - SUPABASE_KEY : la clave pública (anon/publishable).

Cómo verificar que funciona
---------------------------
GitHub → pestaña "Actions" → "Keep Alive Supabase". Cada corrida exitosa
aparece con un tilde verde. Si aparece en rojo, revisar los secrets.

Cómo pausarlo o cambiar la frecuencia
-------------------------------------
Editar la línea "cron" del archivo keepalive.yml. Por defecto:
  "0 */12 * * *"  = cada 12 horas.` },

`BACKUP Y RESTAURACIÓN DE LA BASE DE DATOS
=========================================

Hacer un backup ANTES de cualquier cambio
------------------------------------------
Opción A (SQL, recomendada). En Supabase → SQL Editor:
  drop table if exists alfombras_backup;
  create table alfombras_backup as select * from alfombras;
  drop table if exists ventas_backup;
  create table ventas_backup as select * from ventas;

Opción B (archivo). Table Editor → alfombras → Export → CSV.
Guardar el archivo con la fecha en el nombre.

Restaurar si algo salió mal (rollback)
--------------------------------------
  delete from alfombras;
  insert into alfombras select * from alfombras_backup;
  delete from ventas;
  insert into ventas select * from ventas_backup;
Esto deja las tablas como estaban antes del cambio.

Recomendación
-------------
Hacer backup antes de cada importación de Excel o actualización grande.
Guardar los CSV en una carpeta con la fecha.` },

`ACTUALIZAR LA BASE SIN ROMPER LA APP
====================================

Regla de oro
------------
1. Siempre hacer backup primero (ver instructivo 07).
2. Actualizar por CÓDIGO de producto (no borrar y recargar).
3. Verificar los totales después.

Cómo actualizar el stock desde un Excel
---------------------------------------
Opción A — desde la app:
  Administrador → Inventario → botón Importar (📥) → elegir el Excel.
  El Excel debe tener las columnas: codigo, nombre, color, medidas,
  mes_compra, anio_compra, contenedor, stock, precio_compra, moneda,
  proveedor, observaciones. Se actualiza por "codigo".

Opción B — SQL (para cargas grandes):
  Usar un script con INSERT ... ON CONFLICT (codigo) DO UPDATE.
  Así actualiza los existentes y agrega los nuevos sin duplicar.

Qué NO hacer
------------
- No cambiar los códigos de productos ya cargados.
- No borrar la tabla completa.
- No importar mientras se están cargando ventas.

Sobre los costos en el Excel
----------------------------
La app ahora limpia automáticamente los costos que vengan con símbolos
($, comas, espacios). Igual, lo ideal es que la columna de costo sea
NÚMERO PURO (ej: 226.80, no "$226.80"). Al importar, la app muestra un
resumen previo (cuántos productos, cuántos con costo 0, cuántos con formato
raro) y pide confirmar antes de guardar. Revisá ese resumen: si dice que hay
muchos con costo 0, probablemente el Excel tenga el costo en otra columna o
con un formato que conviene corregir antes.

Verificar
---------
Después de importar, revisar en el Dashboard que los totales tengan sentido,
y en Health Check que la cantidad de productos sea la esperada.` },

/* ============================================================
   CAPA DE DATOS  (Supabase REST vía fetch directo)
   ============================================================ */
function lsKey(table){
  if(table===TABLE_V) return LS_VENTAS;
  if(table===TABLE_LOGS) return "mercer_logs";
  if(table===TABLE_AYUDA) return "mercer_ayuda";
  if(table===TABLE_MOV) return "mercer_movimientos";
  return LS_STOCK;
}
function readLS(table){ return JSON.parse(localStorage.getItem(lsKey(table))||"[]"); }
function writeLS(table,d){ localStorage.setItem(lsKey(table), JSON.stringify(d)); }

const api = {
  headers(){
    // Llaves nuevas (sb_publishable_ / sb_secret_) NO son JWT: van SOLO en el header apikey.
    // Llaves clásicas (eyJ...) van en apikey y también en Authorization Bearer.
    const nueva = /^sb_(publishable|secret)_/.test(SUPABASE_KEY);
    const h = { "apikey":SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=representation" };
    if(!nueva) h["Authorization"]="Bearer "+SUPABASE_KEY;
    return h;
  },
  async list(table=TABLE){
    if(!CLOUD){
      if(table===TABLE) return JSON.parse(localStorage.getItem(LS_STOCK)||"null") || seedLocal();
      return readLS(table);
    }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*&order=id.asc`, { headers:this.headers() });
    if(!r.ok){ const t=await r.text(); throw new Error("("+r.status+") "+t.slice(0,150)); }
    return await r.json();
  },
  async create(row,table=TABLE){
    if(!CLOUD){ const d=readLS(table); const nr={...row,id:Date.now()+Math.floor(Math.random()*1000)}; d.push(nr); writeLS(table,d); return nr; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method:"POST", headers:this.headers(), body:JSON.stringify(row) });
    if(!r.ok){ const t=await r.text(); throw new Error("Error al crear ("+r.status+") "+t.slice(0,120)); }
    return (await r.json())[0];
  },
  async createMany(rows,table=TABLE){
    if(!rows||!rows.length) return [];
    if(!CLOUD){ const d=readLS(table); rows.forEach(row=>d.push({...row,id:Date.now()+Math.floor(Math.random()*100000)})); writeLS(table,d); return d; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method:"POST", headers:this.headers(), body:JSON.stringify(rows) });
    if(!r.ok){ const t=await r.text(); throw new Error("Error al cargar lote ("+r.status+") "+t.slice(0,150)); }
    return await r.json();
  },
  async update(id,row,table=TABLE){
    if(!CLOUD){ const d=readLS(table); const i=d.findIndex(x=>x.id===id); if(i>=0){d[i]={...d[i],...row}; writeLS(table,d); return d[i];} return null; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method:"PATCH", headers:this.headers(), body:JSON.stringify(row) });
    if(!r.ok) throw new Error("Error al actualizar ("+r.status+")");
    return (await r.json())[0];
  },
  async remove(id,table=TABLE){
    if(!CLOUD){ const d=readLS(table).filter(x=>x.id!==id); writeLS(table,d); return; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method:"DELETE", headers:this.headers() });
    if(!r.ok) throw new Error("Error al eliminar ("+r.status+")");
  }
};
function readLocal(){ return readLS(TABLE); }
function writeLocal(d){ writeLS(TABLE,d); }
function seedLocal(){ const d = SEED.map((x,i)=>({...x,id:i+1})); writeLocal(d); return d; }

/* ============================================================
   AUDITORÍA (LOGS) E INCIDENTES
   Registro liviano de eventos importantes. Nunca frena la app:
   si falla el guardado del log, se ignora en silencio.
   ============================================================ */
let CURRENT_USER = "—";
async function logEvent(tipo, detalle, nivel){
  try{
    const row = {
      fecha: new Date().toISOString(),
      usuario: CURRENT_USER,
      tipo: tipo,                 // ej: "login", "alta_producto", "venta", "error"
      detalle: (detalle||"").toString().slice(0,300),
      nivel: nivel || "info"      // "info" | "warn" | "error"
    };
    await api.create(row, TABLE_LOGS);
  }catch(e){ /* el log nunca debe romper la operación principal */ }
}

/* ============================================================
   AUDITORÍA DE INVENTARIO (Actividad de Stock)
   Registra cada movimiento con valores ANTES y DESPUÉS.
   accion: Alta | Compra | Venta | Edición | Eliminación |
           Importación | Ajuste de Stock | Anulación
   Nunca frena la operación principal si falla.
   ============================================================ */
async function logMovimiento(m){
  try{
    const row = {
      fecha: new Date().toISOString(),
      usuario: CURRENT_USER,
      accion: m.accion || "Edición",
      producto: (m.producto||"").toString().slice(0,120),
      contenedor: m.contenedor || "",
      stock_anterior: (m.stock_anterior===undefined||m.stock_anterior===null)?null:Number(m.stock_anterior),
      stock_nuevo:    (m.stock_nuevo===undefined||m.stock_nuevo===null)?null:Number(m.stock_nuevo),
      diferencia:     (m.stock_anterior!=null&&m.stock_nuevo!=null)?(Number(m.stock_nuevo)-Number(m.stock_anterior)):null,
      costo_anterior: (m.costo_anterior===undefined||m.costo_anterior===null)?null:Number(m.costo_anterior),
      costo_nuevo:    (m.costo_nuevo===undefined||m.costo_nuevo===null)?null:Number(m.costo_nuevo),
      condicion:      m.condicion || "",
      observaciones:  (m.observaciones||"").toString().slice(0,300),
      anulado:        false,
      producto_id:    (m.producto_id===undefined)?null:m.producto_id,
      revierte_id:    (m.revierte_id===undefined)?null:m.revierte_id
    };
    return await api.create(row, TABLE_MOV);
  }catch(e){ /* la auditoría nunca debe romper la operación principal */ return null; }
}

const fmt = (n)=> (n||0).toLocaleString("es-AR",{maximumFractionDigits:2});
const money = (n,cur="USD")=> (cur==="USD"?"US$ ":"$ ")+fmt(n);

function Toast({msg,type,onDone}){
  useEffect(()=>{ const t=setTimeout(onDone,2600); return ()=>clearTimeout(t); },[]);
  const c = type==="error" ? "bg-red-600" : type==="warn" ? "bg-amber-600" : "bg-emerald-700";
  return <div className={`fixed top-5 right-5 z-50 ${c} text-white px-5 py-3 rounded-xl shadow-lg fade text-sm font-medium`}>{msg}</div>;
}

function Stat({label,value,sub,icon}){
  return (
    <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
      <div className="flex items-center justify-between">
        <span className="text-2xl">{icon}</span>
        <span className="text-xs uppercase tracking-wider text-sand-600">{label}</span>
      </div>
      <div className="mt-3 text-3xl font-serif font-semibold text-ink">{value}</div>
      {sub && <div className="text-xs text-sand-600 mt-1">{sub}</div>}
    </div>
  );
}

function ChartBox({type,data,options,height}){
  const ref=useRef(); const inst=useRef();
  useEffect(()=>{
    if(inst.current) inst.current.destroy();
    if(ref.current) inst.current = new ChartJS(ref.current, {type,data,options:{...options,maintainAspectRatio:false}});
    return ()=>{ if(inst.current) inst.current.destroy(); };
  },[JSON.stringify(data),JSON.stringify(options),type]);
  return <div style={{height:(height||300)+"px"}}><canvas ref={ref}></canvas></div>;
}

function Modal({title,children,onClose,noBackdropClose,wide}){
  return (
    <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4" onClick={noBackdropClose?undefined:onClose}>

const FieldInp="w-full px-3 py-2 rounded-lg border border-sand-300 focus:border-sand-500 outline-none bg-sand-50 text-sm";
function Field({label,children}){ return (<div><label className="block text-xs font-semibold text-sand-700 mb-1">{label}</label>{children}</div>); }

function ProductForm({initial,onSave,onClose,containers,isSuper,ubicacionesExistentes=[]}){
  const [f,setF]=useState({...EMPTY,...initial});
  const [err,setErr]=useState("");
  const [confirmar,setConfirmar]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setStock=(delta)=>setF(p=>({...p,stock:Math.max(0,(Number(p.stock)||0)+delta)}));
  const esConsignacion = normUbic(f.contenedor).toUpperCase()===CONSIGNACION;
  const validar=()=>{
    if(!f.codigo.trim()||!f.nombre.trim()){ setErr("Código y Nombre son obligatorios."); return false; }
    // Regla de negocio: si el contenedor es CONSIGNACIÓN, la ubicación (cliente) es obligatoria
    if(esConsignacion && (!f.cliente || !normUbic(f.cliente) || normUbic(f.cliente)==="Depósito")){
      setErr("Si el contenedor es CONSIGNACIÓN, la Ubicación (cliente) es obligatoria."); return false;
    }
    return true;
  };
  // Prepara el registro final: normaliza la ubicación y ajusta según consignación
  const prepararRegistro=()=>{
    const reg={...f, stock:Number(f.stock)||0, precio_compra:Number(f.precio_compra)||0};
    if(esConsignacion){
      reg.cliente = normUbic(f.cliente);      // en consignación: cliente normalizado
      reg.consignacion = true;
    } else {
      // Si salió de consignación, la ubicación vuelve a Depósito
      reg.cliente = "Depósito";
      reg.consignacion = false;
    }
    return reg;
  };
  // Al guardar: si es edición, pide confirmación antes de persistir
  const intentarGuardar=()=>{
    setErr("");
    if(!validar()) return;
    if(initial){ setConfirmar(true); }   // editar existente → confirmar
    else { onSave(prepararRegistro()); }
  };
  const confirmarGuardar=()=>{
    setConfirmar(false);
    onSave(prepararRegistro());
  };
  const inp=FieldInp;
  // ¿Puede editar el stock a mano? Solo Administrador1 (super), o en alta de producto nuevo.
  const stockEditable = isSuper || !initial;
  return (
    <Modal title={initial?"Editar alfombra":"Nueva alfombra"} onClose={onClose}>
      {err && <div className="text-red-600 text-sm mb-3">{err}</div>}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Código *"><input className={inp} value={f.codigo} onChange={e=>set('codigo',e.target.value)}/></Field>
        <Field label="Nombre *"><input className={inp} value={f.nombre} onChange={e=>set('nombre',e.target.value)}/></Field>
        <Field label="Color"><input className={inp} value={f.color} onChange={e=>set('color',e.target.value)}/></Field>
        <Field label="Medidas"><input className={inp} value={f.medidas} onChange={e=>set('medidas',e.target.value)} placeholder="2.00x3.00"/></Field>
        <Field label="Mes de compra">
          <select className={inp} value={f.mes_compra} onChange={e=>set('mes_compra',e.target.value)}>
            <option value="">—</option>{MESES.map(m=><option key={m}>{m}</option>)}
          </select>
        </Field>
        <Field label="Año de compra"><input className={inp} value={f.anio_compra} onChange={e=>set('anio_compra',e.target.value)}/></Field>
        <Field label="Contenedor">
          <select className={inp} value={containers.includes(f.contenedor)?f.contenedor:"__nuevo__"} onChange={e=>{ if(e.target.value!=="__nuevo__") set('contenedor',e.target.value); }}>
            {containers.map(c=><option key={c} value={c}>{c}</option>)}
            <option value="__nuevo__">✎ Escribir otro…</option>
          </select>
          {!containers.includes(f.contenedor) && <input className={inp+" mt-1"} value={f.contenedor} onChange={e=>set('contenedor',e.target.value)} placeholder="Nombre del contenedor"/>}
        </Field>
        <Field label={stockEditable?(initial?"Stock (editable · Administrador)":"Cantidad en stock (compra inicial)"):"Stock (no editable)"}>
          {stockEditable ? (
            isSuper && initial ? (
              <div className="flex items-center gap-2">
                <button type="button" onClick={()=>setStock(-1)} className="w-8 h-8 rounded bg-sand-200 hover:bg-sand-300 text-ink font-bold">−</button>
                <input type="number" className={inp+" w-20 text-center"} value={f.stock} onChange={e=>set('stock',e.target.value)}/>
                <button type="button" onClick={()=>setStock(1)} className="w-8 h-8 rounded bg-sand-200 hover:bg-sand-300 text-ink font-bold">+</button>
              </div>
            ) : (
              <input type="number" className={inp} value={f.stock} onChange={e=>set('stock',e.target.value)}/>
            )
          ) : (
            <input type="number" className={inp+" bg-sand-100 text-sand-500 cursor-not-allowed"} value={f.stock} readOnly title="El stock se actualiza solo con compras, ventas, importación o anulaciones"/>
          )}
        </Field>
        <Field label="Costo de compra"><input type="number" step="0.01" className={inp} value={f.precio_compra} onChange={e=>set('precio_compra',e.target.value)}/></Field>
        <Field label="Moneda">
          <select className={inp} value={f.moneda} onChange={e=>set('moneda',e.target.value)}><option>USD</option><option>ARS</option></select>
        </Field>
        <Field label="Proveedor"><input className={inp} value={f.proveedor} onChange={e=>set('proveedor',e.target.value)}/></Field>
        <Field label={esConsignacion?"Ubicación (cliente) *":"Ubicación"}>
          <input className={inp+(esConsignacion?" border-amber-400":"")} value={f.cliente||"Depósito"} onChange={e=>set('cliente',e.target.value)} list="ubic-list" placeholder={esConsignacion?"Cliente (obligatorio)":"Depósito"}/>
          <datalist id="ubic-list">{ubicacionesExistentes.map(u=><option key={u} value={u}/>)}</datalist>
          {esConsignacion && <p className="text-xs text-amber-700 mt-1">En CONSIGNACIÓN la ubicación (cliente) es obligatoria.</p>}
        </Field>
        <div className="sm:col-span-2">
          <label className="block text-xs font-semibold text-sand-700 mb-1">Observaciones</label>
          <textarea className={inp} rows="2" value={f.observaciones} onChange={e=>set('observaciones',e.target.value)}/>
        </div>
      </div>
      <div className="flex gap-3 mt-6 justify-end">
        <button onClick={onClose} className="px-5 py-2.5 rounded-xl border border-sand-300 text-sand-700 hover:bg-sand-100">Cancelar</button>
        <button onClick={intentarGuardar} className="px-6 py-2.5 rounded-xl bg-ink text-white hover:bg-sand-900 font-semibold">Guardar</button>
      </div>

      {confirmar && (
        <Modal title="Confirmar cambios" onClose={()=>setConfirmar(false)} noBackdropClose={true}>
          <p className="text-sm text-ink mb-4">¿Está seguro de guardar estos cambios? Esta modificación actualizará el inventario para todos los usuarios del sistema.</p>
          <div className="flex gap-3 justify-end">
            <button onClick={()=>setConfirmar(false)} className="px-4 py-2 rounded-xl border border-sand-300 text-sm hover:bg-sand-100">Cancelar</button>
            <button onClick={confirmarGuardar} className="px-4 py-2 rounded-xl bg-ink text-white text-sm font-semibold hover:bg-sand-900">Confirmar</button>
          </div>
        </Modal>
      )}
    </Modal>
  );
}

function Dashboard({rows:rowsAll}){
  // Solo productos con stock disponible: los agotados no se muestran en el dashboard
  const rows = rowsAll.filter(r=>(Number(r.stock)||0)>0);
  const totalProd = rows.length;
  const totalStock = rows.reduce((a,r)=>a+(Number(r.stock)||0),0);
  const totalVal = rows.reduce((a,r)=>a+(Number(r.stock)||0)*(Number(r.precio_compra)||0),0);
  const containers = [...new Set(rows.map(r=>r.contenedor).filter(Boolean))];
  const ultimos = [...rows].slice(-5).reverse();

  const byCont = {};
  rows.forEach(r=>{ byCont[r.contenedor||"(sin)"]=(byCont[r.contenedor||"(sin)"]||0)+(Number(r.stock)||0); });

  // Resumen por contenedor: productos con stock, unidades y valor (stock × COSTO)
  const resumenCont = useMemo(()=>{
    const m={};
    rows.forEach(r=>{
      const c=r.contenedor||"(sin contenedor)";
      if(!m[c]) m[c]={contenedor:c,productos:0,unidades:0,valor:0};
      m[c].productos+=1;                                    // rows ya son solo stock>0
      m[c].unidades+=(Number(r.stock)||0);
      m[c].valor+=(Number(r.stock)||0)*(Number(r.precio_compra)||0); // COSTO, nunca precio de venta
    });
    return Object.values(m).sort((a,b)=>a.contenedor.localeCompare(b.contenedor));
  },[rows]);
  const totResumen = resumenCont.reduce((a,x)=>({productos:a.productos+x.productos,unidades:a.unidades+x.unidades,valor:a.valor+x.valor}),{productos:0,unidades:0,valor:0});
  const byMonth = {};
  MESES.forEach(m=>byMonth[m]=0);
  rows.forEach(r=>{ if(r.mes_compra) byMonth[r.mes_compra]=(byMonth[r.mes_compra]||0)+(Number(r.stock)||0); });

  const palette=PALETTE;

  return (
    <div className="fade">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <Stat icon="📦" label="Productos" value={fmt(totalProd)} sub="tipos de alfombra"/>
        <Stat icon="🧮" label="Stock total" value={fmt(totalStock)} sub="unidades"/>
        <Stat icon="💰" label="Valor inventario" value={"US$ "+fmt(totalVal)} sub="a precio de compra"/>
        <Stat icon="🚢" label="Contenedores" value={fmt(containers.length)} sub="orígenes"/>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
          <h3 className="font-serif text-xl text-ink mb-4">Stock por contenedor</h3>
          <ChartBox type="doughnut" data={{
            labels:Object.keys(byCont),
            datasets:[{data:Object.values(byCont),backgroundColor:palette}]
          }} options={{plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}}/>
        </div>
        <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
          <h3 className="font-serif text-xl text-ink mb-4">Compras por mes</h3>
          <ChartBox type="bar" data={{
            labels:MESES,
            datasets:[{label:"Unidades",data:MESES.map(m=>byMonth[m]),backgroundColor:'#b5713b',borderRadius:6}]
          }} options={{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}/>
        </div>
      </div>
      <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
        <h3 className="font-serif text-xl text-ink mb-4">Últimos ingresos</h3>
        <div className="space-y-2">
          {ultimos.map(r=>(
            <div key={r.id} className="flex items-center justify-between py-2 border-b border-sand-100 last:border-0">
              <div><span className="font-mono text-xs text-sand-500">{r.codigo}</span> · <span className="text-sm text-ink">{r.nombre}</span></div>
              <div className="text-sm text-sand-600">{r.contenedor} · {r.stock} u.</div>
            </div>
          ))}
        </div>
      </div>

      {/* Cuadro resumen por contenedor (valor calculado con COSTO) */}
      <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm mt-6">
        <h3 className="font-serif text-xl text-ink mb-1">Resumen por contenedor</h3>
        <p className="text-xs text-sand-500 mb-4">Solo productos con stock disponible · Valor = Stock × Costo</p>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-sand-100 border-b border-sand-200">
              <tr>
                <th className="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wider text-sand-600">Contenedor</th>
                <th className="px-3 py-2 text-center text-xs font-semibold uppercase tracking-wider text-sand-600">Productos c/Stock</th>
                <th className="px-3 py-2 text-center text-xs font-semibold uppercase tracking-wider text-sand-600">Stock (Unid.)</th>
                <th className="px-3 py-2 text-right text-xs font-semibold uppercase tracking-wider text-sand-600">Valor USD</th>
              </tr>
            </thead>
            <tbody>
              {resumenCont.map(c=>(
                <tr key={c.contenedor} className="border-b border-sand-100 hover:bg-sand-50">
                  <td className="px-3 py-2 text-ink">{c.contenedor}</td>
                  <td className="px-3 py-2 text-center">{c.productos}</td>
                  <td className="px-3 py-2 text-center">{fmt(c.unidades)}</td>
                  <td className="px-3 py-2 text-right font-medium">US$ {fmt(c.valor)}</td>
                </tr>
              ))}
              {resumenCont.length===0 && <tr><td colSpan="4" className="text-center py-6 text-sand-500">Sin productos con stock</td></tr>}
            </tbody>
            {resumenCont.length>0 && (
              <tfoot>
                <tr className="border-t-2 border-sand-300 font-semibold bg-sand-50">
                  <td className="px-3 py-2 text-ink">TOTAL</td>
                  <td className="px-3 py-2 text-center">{totResumen.productos}</td>
                  <td className="px-3 py-2 text-center">{fmt(totResumen.unidades)}</td>
                  <td className="px-3 py-2 text-right">US$ {fmt(totResumen.valor)}</td>
                </tr>
              </tfoot>
            )}
          </table>
        </div>
      </div>
    </div>
  );
}

function Table({rows,role,isSuper,onEdit,onDelete,onStock}){
  const [q,setQ]=useState(""); const [qc,setQc]=useState("");
  const [fc,setFc]=useState(""); const [fm,setFm]=useState(""); const [fy,setFy]=useState("");
  const [fu,setFu]=useState(""); // filtro Ubicación (cliente)
  const [sort,setSort]=useState({k:"codigo",dir:1});
  const [perPage,setPerPage]=useState(15); const [page,setPage]=useState(1);
  const [incluirStock0,setIncluirStock0]=useState(false); // por defecto oculta los agotados

  const containers=[...new Set(rows.map(r=>r.contenedor).filter(Boolean))].sort();
  const anios=[...new Set(rows.map(r=>r.anio_compra).filter(Boolean))].sort();
  const ubicaciones=[...new Set(rows.map(r=>normUbic(r.cliente)||"Depósito").filter(Boolean))].sort();
  const agotados=rows.filter(r=>(Number(r.stock)||0)<=0).length;

  const filtered=useMemo(()=>{
    let d=rows.filter(r=>
      (incluirStock0 || (Number(r.stock)||0)>0) &&
      (!q || (r.nombre||"").toLowerCase().includes(q.toLowerCase())) &&
      (!qc || (r.codigo||"").toLowerCase().includes(qc.toLowerCase())) &&
      (!fc || r.contenedor===fc) &&
      (!fm || r.mes_compra===fm) &&
      (!fy || r.anio_compra===fy) &&
      (!fu || (normUbic(r.cliente)||"Depósito")===fu)
    );
    d=[...d].sort((a,b)=>{
      let x=a[sort.k],y=b[sort.k];
      if(sort.k==="stock"||sort.k==="precio_compra"){x=Number(x)||0;y=Number(y)||0;}
      else {x=(x||"").toString().toLowerCase();y=(y||"").toString().toLowerCase();}
      return x<y?-sort.dir:x>y?sort.dir:0;
    });
    return d;
  },[rows,q,qc,fc,fm,fy,fu,sort,incluirStock0]);

  useEffect(()=>{setPage(1);},[q,qc,fc,fm,fy,fu,perPage,incluirStock0]);
  const pages=Math.max(1,Math.ceil(filtered.length/perPage));
  const view=filtered.slice((page-1)*perPage,page*perPage);
  // Totales según el filtro actual (sobre TODOS los registros filtrados, no solo la página visible)
  const totalStock=filtered.reduce((a,r)=>a+(Number(r.stock)||0),0);
  const totalCosto=filtered.reduce((a,r)=>a+(Number(r.stock)||0)*(Number(r.precio_compra)||0),0);
  const th=(k,label)=>(
    <th onClick={()=>setSort(s=>({k,dir:s.k===k?-s.dir:1}))}
      className="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wider text-sand-600 cursor-pointer hover:text-ink whitespace-nowrap select-none">
      {label} {sort.k===k?(sort.dir===1?"▲":"▼"):""}
    </th>
  );
  const inp="px-3 py-2 rounded-lg border border-sand-300 bg-white outline-none focus:border-sand-500 text-sm";
  return (
    <div className="fade">
      <div className="flex flex-wrap gap-2 mb-4">
        <input className={inp+" flex-1 min-w-[140px]"} placeholder="🔍 Buscar por nombre" value={q} onChange={e=>setQ(e.target.value)}/>
        <input className={inp+" flex-1 min-w-[120px]"} placeholder="🔍 Código" value={qc} onChange={e=>setQc(e.target.value)}/>
        <select className={inp} value={fc} onChange={e=>setFc(e.target.value)}><option value="">Contenedor</option>{containers.map(c=><option key={c}>{c}</option>)}</select>
        <select className={inp} value={fm} onChange={e=>setFm(e.target.value)}><option value="">Mes</option>{MESES.map(m=><option key={m}>{m}</option>)}</select>
        <select className={inp} value={fy} onChange={e=>setFy(e.target.value)}><option value="">Año</option>{anios.map(a=><option key={a}>{a}</option>)}</select>
        <select className={inp} value={fu} onChange={e=>setFu(e.target.value)}><option value="">Ubicación</option>{ubicaciones.map(u=><option key={u}>{u}</option>)}</select>
        <select className={inp} value={perPage} onChange={e=>setPerPage(Number(e.target.value))}>{[10,15,25,50,100].map(n=><option key={n} value={n}>{n}/pág</option>)}</select>
        <label className="flex items-center gap-2 px-3 py-2 rounded-lg border border-sand-300 bg-white text-sm text-sand-700 cursor-pointer hover:bg-sand-50 select-none" title="Mostrar también los artículos con stock 0">
          <input type="checkbox" checked={incluirStock0} onChange={e=>setIncluirStock0(e.target.checked)} className="accent-ink w-4 h-4"/>
          Incluir Stock 0{agotados>0 && <span className="text-sand-400">({agotados})</span>}
        </label>
      </div>
      <div className="bg-white rounded-2xl border border-sand-200 shadow-sm overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-sand-100 border-b border-sand-200">
            <tr>
              {th("codigo","Código")}{th("nombre","Nombre")}{th("color","Color")}{th("medidas","Medidas")}
              {th("contenedor","Contenedor")}{th("mes_compra","Mes")}{th("anio_compra","Año")}
              {th("stock","Stock")}{th("precio_compra","Costo")}{th("cliente","Ubicación")}
              <th className="px-3 py-2 text-right text-xs font-semibold uppercase text-sand-600">Acciones</th>
            </tr>
          </thead>
          <tbody>

  const byCont=agg("contenedor"), byMonth=agg("mes_compra");

        </div>
        <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
          <h3 className="font-serif text-xl mb-4">Stock por mes de compra</h3>
          <ChartBox type="line" data={{labels:MESES,datasets:[{label:"Unidades",data:MESES.map(m=>byMonth[m]||0),borderColor:'#a03d3d',backgroundColor:'rgba(160,61,61,.12)',fill:true,tension:.3}]}} options={{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}/>
        </div>
      </div>
      <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
        <h3 className="font-serif text-xl mb-4">Top productos por stock</h3>
        <ChartBox type="bar" data={{
          labels:byProd.map(r=>{
            // Nombre completo + medida. Se parte en varias líneas para que no se corte.
            const txt=(r.nombre||"")+(r.medidas?" · "+r.medidas:"");
            const palabras=txt.split(" "); const lineas=[]; let act="";
            palabras.forEach(p=>{ if((act+" "+p).trim().length>24){ lineas.push(act.trim()); act=p; } else act+=" "+p; });
            if(act.trim()) lineas.push(act.trim());
            return lineas;  // array = varias líneas en Chart.js
          }),
          datasets:[{data:byProd.map(r=>r.stock),backgroundColor:'#3d7068',borderRadius:6}]
        }} options={{
          indexAxis:'y',

          scales:{x:{beginAtZero:true}, y:{ticks:{autoSkip:false,font:{size:10}}}}
        }} height={Math.max(320, byProd.length*46)}/>
      </div>
    </div>
  );
}

const VENTA_EMPTY = { fecha:new Date().toISOString().slice(0,10), contenedor_origen:"", ubicacion_origen:"", producto:"", producto_id:null, modelo:"", color:"", medida:"", cantidad:1, precio_unitario:0, importe_total:0, cliente:"", telefono:"", vendedora:"", estado:"Cobrada y entregada", condicion:"Minorista", facturacion:"Sin Factura", costo_unitario:0, canje:false, observaciones:"" };

// Estados de la operación
const ESTADOS_VENTA = ["Cobrada y entregada","Cobrada y falta entregar","Entregada y falta cobrar"];
// Condiciones de venta. El descuento se aplica automáticamente sobre el precio unitario.
// "Consignación": se registra la venta pero NO descuenta stock (la mercadería sigue en poder del cliente).
const CONDICIONES = [
  {label:"Minorista", desc:0},
  {label:"Minorista 10%", desc:10},
  {label:"Minorista 20%", desc:20},
  {label:"Minorista 30%", desc:30},
  {label:"Mayorista", desc:0},
  {label:"Consignación", desc:0},
];
// Condición que NO descuenta stock
const CONDICION_SIN_DESCUENTO = "Consignación";
const FACTURACION = ["Sin Factura","Factura A"];
// Colores de referencia para el estado
const ESTADO_COLOR = {
  "Cobrada y entregada":"bg-emerald-100 text-emerald-800",
  "Cobrada y falta entregar":"bg-amber-100 text-amber-800",
  "Entregada y falta cobrar":"bg-red-100 text-red-800",
};

// Calcula importe, costo total y margen de una venta
function calcVenta(f){
  const cant  = Number(f.cantidad)||0;
  const pu    = Number(f.precio_unitario)||0;
  const desc  = (CONDICIONES.find(c=>c.label===f.condicion)||{desc:0}).desc;
  const puNeto= pu*(1-desc/100);
  const canje = !!f.canje;
  const importe = canje ? 0 : cant*puNeto;          // en canje no hay ingreso de dinero
  const costoU  = Number(f.costo_unitario)||0;
  const costoT  = cant*costoU;
  const margen  = importe-costoT;                    // ganancia en dinero
  const margenPct = importe>0 ? (margen/importe)*100 : (canje ? -100 : 0);
  return { cant, pu, desc, puNeto, canje, importe, costoU, costoT, margen, margenPct };
}

function VentaForm({initial,onSave,onClose,productos}){
  // Campos GENERALES de la venta (se mantienen entre productos, editables)
  const GEN_EMPTY={ fecha:new Date().toISOString().slice(0,10), cliente:"", telefono:"", vendedora:"", estado:"Cobrada y entregada", facturacion:"Sin Factura", condicion:"Minorista", observaciones:"" };
  // Campos del PRODUCTO (se limpian al Agregar)
  const PROD_EMPTY={ contenedor_origen:"", ubicacion_origen:"", producto:"", producto_id:null, modelo:"", medida:"", cantidad:1, precio_unitario:0, costo_unitario:0, canje:false };

  const [gen,setGen]=useState(()=>{ const g={...GEN_EMPTY}; if(initial){ Object.keys(GEN_EMPTY).forEach(k=>{ if(initial[k]!==undefined) g[k]=initial[k]; }); } return g; });
  const [f,setF]=useState({...PROD_EMPTY});
  const [lista,setLista]=useState([]);           // productos agregados a la venta
  const [editIdx,setEditIdx]=useState(null);     // índice que se está editando
  const [err,setErr]=useState("");
  const [showResumen,setShowResumen]=useState(false);
  const [askAgregar,setAskAgregar]=useState(false);

  const setG=(k,v)=>setGen(p=>({...p,[k]:v}));
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  // Cascada: contenedores/ubicaciones/productos con stock > 0
  const contenedores=[...new Set(productos.filter(p=>(Number(p.stock)||0)>0).map(p=>p.contenedor).filter(Boolean))].sort();
  const ubicaciones=f.contenedor_origen
    ? [...new Set(productos.filter(p=>p.contenedor===f.contenedor_origen && (Number(p.stock)||0)>0).map(p=>p.cliente||"Depósito"))].sort()
    : [];
  const productosDisp=(f.contenedor_origen && f.ubicacion_origen)
    ? productos.filter(p=>p.contenedor===f.contenedor_origen && (p.cliente||"Depósito")===f.ubicacion_origen && (Number(p.stock)||0)>0)
    : [];

  const prodSel=f.producto_id ? productos.find(p=>p.id===f.producto_id) : null;
  const stockDisp=prodSel ? (Number(prodSel.stock)||0) : null;
  // Cantidad ya cargada del mismo producto en la lista temporal (excluyendo la línea en edición)
  const yaCargado=lista.reduce((a,it,i)=>(it.producto_id===f.producto_id && i!==editIdx)?a+(Number(it.cantidad)||0):a,0);
  const esConsig=gen.condicion===CONDICION_SIN_DESCUENTO;

  const pickContenedor=(cont)=>setF(prev=>({...prev,...PROD_EMPTY, contenedor_origen:cont}));
  const pickUbicacion=(ubi)=>setF(prev=>({...prev, ubicacion_origen:ubi, producto:"", producto_id:null, modelo:"", medida:"", costo_unitario:0}));
  const pickProducto=(nombre)=>{
    const p=productosDisp.find(x=>x.nombre===nombre)||productos.find(x=>x.nombre===nombre);
    setF(prev=>{
      const nx={...prev, producto:nombre};
      if(p){ nx.producto_id=p.id; nx.modelo=p.codigo||""; nx.medida=p.medidas||""; nx.costo_unitario=Number(p.precio_compra)||0; }
      else { nx.producto_id=null; }
      return nx;
    });
  };

  // Calcular importe/margen de la línea del producto actual (usa condición general)
  const calcLinea=(prod)=>calcVenta({...prod, condicion:gen.condicion});
  const cLinea=calcLinea(f);

  // Validar el producto actual antes de agregarlo a la lista
  const validarProducto=()=>{
    if(!f.contenedor_origen){ setErr("Elegí el contenedor de origen."); return false; }
    if(!f.ubicacion_origen){ setErr("Elegí la ubicación de origen."); return false; }
    if(!f.producto.trim() || !f.producto_id){ setErr("Elegí un producto de la lista."); return false; }
    const cant=Number(f.cantidad)||0;
    if(cant<=0){ setErr("La cantidad debe ser mayor a 0."); return false; }
    if((Number(f.precio_unitario)||0)<=0){ setErr("El precio unitario es obligatorio."); return false; }
    // Validación de stock acumulada (suma de lo cargado del mismo producto no supera el stock)
    if(!esConsig && stockDisp!==null){
      if(stockDisp<=0){ setErr("Ese producto no tiene stock disponible."); return false; }
      if(yaCargado+cant>stockDisp){ setErr(`Stock insuficiente: ya cargaste ${yaCargado} y querés ${cant}, pero hay ${stockDisp}.`); return false; }
    }
    return true;
  };

  // AGREGAR: valida y suma el producto a la lista temporal, limpia solo los campos de producto
  const agregar=()=>{
    setErr("");
    if(!validarProducto()) return;
    const linea={ ...f, cantidad:Number(f.cantidad)||0, precio_unitario:Number(f.precio_unitario)||0, costo_unitario:Number(f.costo_unitario)||0 };
    if(editIdx!==null){ setLista(ls=>ls.map((it,i)=>i===editIdx?linea:it)); setEditIdx(null); }
    else { setLista(ls=>[...ls,linea]); }
    setF({...PROD_EMPTY});   // limpia solo campos de producto
  };

  const editarLinea=(i)=>{ setF({...lista[i]}); setEditIdx(i); setErr(""); };
  const eliminarLinea=(i)=>{ setLista(ls=>ls.filter((_,x)=>x!==i)); if(editIdx===i){ setF({...PROD_EMPTY}); setEditIdx(null); } };

  // Validar datos generales (obligatorios de la venta)
  const validarGenerales=()=>{
    if(!gen.fecha){ setErr("La fecha es obligatoria."); return false; }
    if(!gen.vendedora || !gen.vendedora.trim()){ setErr("La vendedora es obligatoria."); return false; }
    if(!gen.estado){ setErr("El estado es obligatorio."); return false; }
    if(!gen.condicion){ setErr("La condición de venta es obligatoria."); return false; }
    return true;
  };

  // RESUMEN: abre el modal de revisión. Avisa si hay un producto sin agregar.
  const irAResumen=()=>{
    setErr("");
    if(!validarGenerales()) return;
    const hayProductoEnForm = f.producto_id || f.producto.trim();
    if(hayProductoEnForm){ setAskAgregar(true); return; }
    if(lista.length===0){ setErr("Agregá al menos un producto a la venta."); return; }
    setShowResumen(true);
  };

  // GUARDAR DEFINITIVO: crea una venta por cada producto de la lista (comparten datos generales)
  const guardarTodo=()=>{
    const ventas=lista.map(it=>{
      const cc=calcVenta({...it, condicion:gen.condicion});
      return {
        ...gen, ...it,
        condicion:gen.condicion,
        cantidad:cc.cant, precio_unitario:cc.pu, costo_unitario:cc.costoU,
        canje:!!it.canje, importe_total:cc.importe
      };
    });
    onSave(ventas);   // App recibe un ARRAY de ventas
  };

  const inp=FieldInp;
  const totalVenta=lista.reduce((a,it)=>a+calcVenta({...it,condicion:gen.condicion}).importe,0);

  return (
    <Modal title={initial?"Editar venta":"Registrar venta"} onClose={onClose} noBackdropClose={true} wide={true}>
      {err && <div className="text-red-600 text-sm mb-3 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{err}</div>}

      {/* DATOS GENERALES DE LA VENTA */}
      <div className="mb-2 text-xs font-semibold uppercase tracking-wider text-sand-500">Datos de la venta</div>
      <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-3 mb-5">
        <Field label="Fecha *"><input type="date" className={inp} value={gen.fecha} onChange={e=>setG('fecha',e.target.value)}/></Field>
        <Field label="Vendedora *"><input className={inp} value={gen.vendedora} onChange={e=>setG('vendedora',e.target.value)}/></Field>
        <Field label="Estado *">
          <select className={inp} value={gen.estado} onChange={e=>setG('estado',e.target.value)}>{ESTADOS_VENTA.map(s=><option key={s}>{s}</option>)}</select>
        </Field>
        <Field label="Condición de venta *">
          <select className={inp} value={gen.condicion} onChange={e=>setG('condicion',e.target.value)}>{CONDICIONES.map(x=><option key={x.label}>{x.label}</option>)}</select>
        </Field>
        <Field label="Cliente"><input className={inp} value={gen.cliente} onChange={e=>setG('cliente',e.target.value)}/></Field>
        <Field label="Teléfono"><input className={inp} value={gen.telefono} onChange={e=>setG('telefono',e.target.value)} placeholder="11 5555-5555"/></Field>
        <Field label="Facturación">
          <select className={inp} value={gen.facturacion} onChange={e=>setG('facturacion',e.target.value)}>{FACTURACION.map(x=><option key={x}>{x}</option>)}</select>
        </Field>
        <Field label="Observaciones"><input className={inp} value={gen.observaciones} onChange={e=>setG('observaciones',e.target.value)}/></Field>
      </div>
      {esConsig && <div className="text-xs text-purple-700 bg-purple-50 border border-purple-200 rounded-lg px-3 py-2 mb-4">Consignación: se registran las ventas pero NO se descuenta stock.</div>}

      {/* CARGA DE PRODUCTO */}
      <div className="mb-2 text-xs font-semibold uppercase tracking-wider text-sand-500">{editIdx!==null?"Editando producto":"Agregar producto"}</div>
      <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        <Field label="Contenedor de origen *">
          <select className={inp} value={f.contenedor_origen} onChange={e=>pickContenedor(e.target.value)}>
            <option value="">— Contenedor —</option>{contenedores.map(ct=><option key={ct}>{ct}</option>)}
          </select>
        </Field>
        <Field label="Ubicación de origen *">
          <select className={inp} value={f.ubicacion_origen} onChange={e=>pickUbicacion(e.target.value)} disabled={!f.contenedor_origen}>
            <option value="">{f.contenedor_origen?"— Ubicación —":"Elegí contenedor"}</option>{ubicaciones.map(u=><option key={u}>{u}</option>)}
          </select>
        </Field>
        <Field label="Producto *">
          <select className={inp} value={f.producto} onChange={e=>pickProducto(e.target.value)} disabled={!f.ubicacion_origen}>
            <option value="">{f.ubicacion_origen?`— Producto (${productosDisp.length}) —`:"Elegí ubicación"}</option>
            {productosDisp.map(p=><option key={p.id} value={p.nombre}>{p.nombre} (stock {p.stock})</option>)}
          </select>
        </Field>
        <Field label="Medida"><input className={inp+" bg-sand-100"} value={f.medida} readOnly/></Field>
        <Field label={"Cantidad *"+(stockDisp!==null?` (disp ${stockDisp}${yaCargado?`, cargado ${yaCargado}`:""})`:"")}>
          <input type="number" min="1" className={inp} value={f.cantidad} onChange={e=>set('cantidad',e.target.value)}/>
        </Field>
        <Field label={<span>Precio unitario * {(Number(f.precio_unitario)||0)>0 && (Number(f.costo_unitario)||0)>0 && !f.canje && (
            <span className={"font-semibold "+(cLinea.margen>0?"text-emerald-600":cLinea.margen<0?"text-red-600":"text-ink")}>

        </Field>
        <Field label="Costo unitario"><input type="number" step="0.01" className={inp+" bg-sand-100"} value={f.costo_unitario} readOnly/></Field>
        <Field label="Canje (sin cobro)">
          <select className={inp} value={f.canje?"Sí":"No"} onChange={e=>set('canje',e.target.value==="Sí")}><option>No</option><option>Sí</option></select>
        </Field>
      </div>
      {!esConsig && stockDisp!==null && (yaCargado+(Number(f.cantidad)||0))>stockDisp && <div className="text-xs text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mt-3">La cantidad supera el stock disponible ({stockDisp}). Ya cargaste {yaCargado}.</div>}

      {/* LISTA DE PRODUCTOS AGREGADOS */}
      {lista.length>0 && (
        <div className="mt-5">
          <div className="mb-2 text-xs font-semibold uppercase tracking-wider text-sand-500">Productos agregados ({lista.length})</div>
          <div className="bg-sand-50 rounded-xl border border-sand-200 overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="border-b border-sand-200"><tr>
                {["Producto","Contenedor","Ubicación","Cant.","P. unit.","Importe",""].map(h=><th key={h} className="px-3 py-2 text-left text-xs font-semibold text-sand-600">{h}</th>)}
              </tr></thead>
              <tbody>
                {lista.map((it,i)=>{ const cc=calcVenta({...it,condicion:gen.condicion}); return (
                  <tr key={i} className={"border-b border-sand-100 last:border-0 "+(editIdx===i?"bg-amber-50":"")}>

            </table>

          </div>
        </Modal>

      {/* RESUMEN FINAL */}
      {showResumen && (
        <Modal title="Resumen de la venta" onClose={()=>setShowResumen(false)} noBackdropClose={true} wide={true}>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4 text-sm">
            <div><span className="text-sand-500 text-xs block">Fecha</span>{gen.fecha}</div>
            <div><span className="text-sand-500 text-xs block">Cliente</span>{gen.cliente||"—"}</div>
            <div><span className="text-sand-500 text-xs block">Vendedora</span>{gen.vendedora}</div>
            <div><span className="text-sand-500 text-xs block">Condición</span>{gen.condicion}</div>
            <div><span className="text-sand-500 text-xs block">Estado</span>{gen.estado}</div>
            <div><span className="text-sand-500 text-xs block">Facturación</span>{gen.facturacion}</div>
            <div><span className="text-sand-500 text-xs block">Teléfono</span>{gen.telefono||"—"}</div>
          </div>
          <p className="text-xs text-sand-500 mb-2">Así van a quedar registradas en la solapa Ventas ({lista.length} {lista.length===1?"registro":"registros"}):</p>
          <div className="bg-sand-50 rounded-xl border border-sand-200 overflow-x-auto mb-2">
            <table className="w-full text-sm">
              <thead className="border-b border-sand-200"><tr>
                {["Producto","Contenedor","Ubicación","Cant.","P. unit.","Costo","Importe","Margen"].map(h=><th key={h} className="px-3 py-2 text-left text-xs font-semibold text-sand-600">{h}</th>)}
              </tr></thead>
              <tbody>
                {lista.map((it,i)=>{ const cc=calcVenta({...it,condicion:gen.condicion}); return (
                  <tr key={i} className="border-b border-sand-100 last:border-0">
                    <td className="px-3 py-2">{it.producto}</td>
                    <td className="px-3 py-2 whitespace-nowrap text-sand-600">{it.contenedor_origen}</td>
                    <td className="px-3 py-2 whitespace-nowrap text-sand-600">{it.ubicacion_origen}</td>
                    <td className="px-3 py-2 text-center">{it.cantidad}</td>
                    <td className="px-3 py-2 whitespace-nowrap">US$ {fmt(it.precio_unitario)}</td>

                    <td className="px-3 py-2 whitespace-nowrap font-medium">{cc.canje?"CANJE":"US$ "+fmt(cc.importe)}</td>
                    <td className={"px-3 py-2 whitespace-nowrap "+(cc.margen>=0?"text-emerald-700":"text-red-600")}>US$ {fmt(cc.margen)}</td>
                  </tr>
                );})}
              </tbody>
              <tfoot><tr className="border-t border-sand-300 font-semibold bg-sand-100">
                <td className="px-3 py-2" colSpan="6">Total</td>
                <td className="px-3 py-2 whitespace-nowrap" colSpan="2">US$ {fmt(totalVenta)}</td>
              </tr></tfoot>
            </table>
          </div>
          {!esConsig && <p className="text-xs text-sand-500 mb-4">Al guardar se descontará el stock de cada producto según su cantidad.</p>}
          {esConsig && <p className="text-xs text-purple-600 mb-4">Consignación: se registran las ventas pero NO se descuenta stock.</p>}
          <div className="flex gap-3 justify-end">
            <button onClick={()=>setShowResumen(false)} className="px-5 py-2.5 rounded-xl border border-sand-300 text-sand-700 hover:bg-sand-100">Atrás</button>
            <button onClick={guardarTodo} className="px-6 py-2.5 rounded-xl bg-ink text-white hover:bg-sand-900 font-semibold">Guardar Venta</button>
          </div>
        </Modal>
      )}
    </Modal>
  );
}

function VentasDashboard({ventas:ventasRaw}){
  const ventas=ventasRaw.filter(v=>!v.anulada);
  const hoy=new Date().toISOString().slice(0,10);
  const mesActual=hoy.slice(0,7);
  const ventasDia=ventas.filter(v=>v.fecha===hoy);
  const ventasMes=ventas.filter(v=>(v.fecha||"").slice(0,7)===mesActual);
  const num=(v,k)=>Number(v[k])||0;

  const facturacionDia=ventasDia.reduce((a,v)=>a+num(v,"importe_total"),0);
  const facturacionMes=ventasMes.reduce((a,v)=>a+num(v,"importe_total"),0);
  const facturacionTotal=ventas.reduce((a,v)=>a+num(v,"importe_total"),0);
  const productosVendidos=ventas.reduce((a,v)=>a+num(v,"cantidad"),0);
  const ticketPromedio=ventas.length? facturacionTotal/ventas.length : 0;

  // Margen total y pendientes por estado
  const margenTotal=ventas.reduce((a,v)=>a+calcVenta(v).margen,0);
  const margenPct = facturacionTotal>0 ? (margenTotal/facturacionTotal)*100 : 0;
  const faltaCobrar=ventas.filter(v=>v.estado==="Entregada y falta cobrar");
  const faltaEntregar=ventas.filter(v=>v.estado==="Cobrada y falta entregar");
  const montoFaltaCobrar=faltaCobrar.reduce((a,v)=>a+num(v,"importe_total"),0);
  const canjes=ventas.filter(v=>v.canje);

  // Ranking productos
  const rank={};
  ventas.forEach(v=>{ const k=v.producto||"(sin)"; rank[k]=(rank[k]||0)+num(v,"cantidad"); });
  const ranking=Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Por vendedora
  const porVend={};
  ventas.forEach(v=>{ const k=v.vendedora||"(sin)"; porVend[k]=(porVend[k]||0)+num(v,"importe_total"); });
  const vendLabels=Object.keys(porVend), vendVals=Object.values(porVend);
  const totalVend=vendVals.reduce((a,b)=>a+b,0)||1;

  // Evolución diaria (últimos 14 días)
  const dias=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); dias.push(d.toISOString().slice(0,10)); }
  const evol=dias.map(d=>ventas.filter(v=>v.fecha===d).reduce((a,v)=>a+num(v,"importe_total"),0));

  const palette=PALETTE;
  return (
    <div className="fade space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <Stat icon="📅" label="Ventas del día" value={money(facturacionDia)} sub={`${ventasDia.length} operación(es)`}/>
        <Stat icon="🗓️" label="Ventas del mes" value={money(facturacionMes)} sub={`${ventasMes.length} operación(es)`}/>
        <Stat icon="📦" label="Productos vendidos" value={fmt(productosVendidos)} sub="unidades totales"/>
        <Stat icon="💵" label="Facturación total" value={money(facturacionTotal)} sub="histórico"/>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <Stat icon="🎫" label="Ticket promedio" value={money(ticketPromedio)} sub="por venta"/>
        <Stat icon="🧾" label="Cantidad de ventas" value={fmt(ventas.length)} sub="operaciones"/>
        <Stat icon="📈" label="Margen total" value={money(margenTotal)} sub={`${margenPct.toFixed(1)}% sobre facturación`}/>
        <Stat icon="🤝" label="Canjes" value={fmt(canjes.length)} sub="entregas sin cobro"/>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <Stat icon="⏳" label="Falta cobrar" value={money(montoFaltaCobrar)} sub={`${faltaCobrar.length} venta(s)`}/>
        <Stat icon="🚚" label="Falta entregar" value={fmt(faltaEntregar.length)} sub="venta(s) pendientes"/>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
          <h3 className="font-serif text-xl mb-4">Ranking de productos más vendidos</h3>
          <ChartBox type="bar" data={{
            labels:ranking.map(r=>r[0].slice(0,24)),
            datasets:[{data:ranking.map(r=>r[1]),backgroundColor:'#b5713b',borderRadius:6}]
          }} options={{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}}/>
        </div>
        <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
          <h3 className="font-serif text-xl mb-4">Ventas por vendedora</h3>
          <ChartBox type="bar" data={{
            labels:vendLabels,
            datasets:[{label:"Facturación",data:vendVals,backgroundColor:palette,borderRadius:6}]
          }} options={{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}/>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
          <h3 className="font-serif text-xl mb-4">Participación por vendedora</h3>
          <ChartBox type="doughnut" data={{
            labels:vendLabels.map((l,i)=>`${l} (${((vendVals[i]/totalVend)*100).toFixed(1)}%)`),
            datasets:[{data:vendVals,backgroundColor:palette}]
          }} options={{plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}}/>
        </div>
        <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm">
          <h3 className="font-serif text-xl mb-4">Evolución diaria (14 días)</h3>
          <ChartBox type="line" data={{
            labels:dias.map(d=>d.slice(5)),
            datasets:[{label:"Facturación",data:evol,borderColor:'#3d7068',backgroundColor:'rgba(61,112,104,.12)',fill:true,tension:.3}]
          }} options={{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}/>
        </div>
      </div>
    </div>
  );
}

const COLS=["codigo","nombre","color","medidas","mes_compra","anio_compra","contenedor","stock","precio_compra","moneda","proveedor","observaciones","cliente"];
function exportExcel(rows){
  const ws=XLSX.utils.json_to_sheet(rows.map(r=>{const o={};COLS.forEach(c=>o[c]=r[c]);return o;}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Stock");
  XLSX.writeFile(wb,"Mercer_Stock.xlsx");
}
// Helper: agrega tabla resumen agregando por una clave
function aggBy(rows,key,valKey="stock"){ const o={}; rows.forEach(r=>{const k=r[key]||"(sin)"; o[k]=(o[k]||0)+(Number(r[valKey])||0);}); return o; }

// PDF contextual: descarga lo que se está viendo en la pestaña actual
function exportPDFContext(tab,{rows,ventas}){
  const { jsPDF }=window.jspdf;
  const fecha=new Date().toLocaleString("es-AR");
  const num=(v,k)=>Number(v[k])||0;

  // ---- INVENTARIO / COMPRAS: tabla de productos ----
  if(tab==="table"||tab==="compras"){
    const doc=new jsPDF({orientation:"landscape"});
    doc.setFontSize(16); doc.text("MERCER · Inventario de Alfombras",14,15);
    doc.setFontSize(9); doc.text("Generado: "+fecha,14,21);
    doc.autoTable({
      startY:26, styles:{fontSize:7}, headStyles:{fillColor:[130,104,75]},
      head:[["Código","Nombre","Color","Medidas","Cont.","Mes","Año","Stock","Precio","Mon."]],
      body:rows.map(r=>[r.codigo,r.nombre,r.color,r.medidas,r.contenedor,r.mes_compra,r.anio_compra,r.stock,fmt(r.precio_compra),r.moneda])
    });
    doc.save("Mercer_Inventario.pdf"); return;
  }

  // ---- DASHBOARD (stock): resumen con KPIs y agregados ----
  if(tab==="dash"){
    const doc=new jsPDF();
    rows=rows.filter(r=>(Number(r.stock)||0)>0); // sin agotados, igual que en pantalla
    const totalProd=rows.length;
    const totalStock=rows.reduce((a,r)=>a+num(r,"stock"),0);
    const totalVal=rows.reduce((a,r)=>a+num(r,"stock")*num(r,"precio_compra"),0);
    const conts=[...new Set(rows.map(r=>r.contenedor).filter(Boolean))];
    doc.setFontSize(16); doc.text("MERCER · Dashboard de Stock",14,15);
    doc.setFontSize(9); doc.text("Generado: "+fecha,14,21);
    doc.autoTable({ startY:26, styles:{fontSize:10}, headStyles:{fillColor:[130,104,75]},
      head:[["Indicador","Valor"]],
      body:[
        ["Productos (tipos)",fmt(totalProd)],
        ["Stock total (unidades)",fmt(totalStock)],
        ["Valor del inventario","US$ "+fmt(totalVal)],
        ["Contenedores",fmt(conts.length)],
      ]});
    const byC=aggBy(rows,"contenedor");
    doc.autoTable({ styles:{fontSize:9}, headStyles:{fillColor:[130,104,75]},
      head:[["Stock por contenedor","Unidades"]],
      body:Object.entries(byC).map(([k,v])=>[k,fmt(v)]) });
    const byM=aggBy(rows,"mes_compra");
    doc.autoTable({ styles:{fontSize:9}, headStyles:{fillColor:[130,104,75]},
      head:[["Compras por mes","Unidades"]],
      body:Object.entries(byM).map(([k,v])=>[k,fmt(v)]) });
    doc.save("Mercer_Dashboard.pdf"); return;
  }

  // ---- REPORTES ----
  if(tab==="reports"){
    const doc=new jsPDF();
    rows=rows.filter(r=>(Number(r.stock)||0)>0); // sin agotados, igual que en pantalla
    const totalVal=rows.reduce((a,r)=>a+num(r,"stock")*num(r,"precio_compra"),0);
    doc.setFontSize(16); doc.text("MERCER · Reportes",14,15);
    doc.setFontSize(9); doc.text("Generado: "+fecha,14,21);
    doc.autoTable({ startY:26, styles:{fontSize:10}, headStyles:{fillColor:[130,104,75]},
      head:[["Indicador","Valor"]], body:[["Valor total del inventario","US$ "+fmt(totalVal)]] });
    const byC=aggBy(rows,"contenedor");
    doc.autoTable({ styles:{fontSize:9}, headStyles:{fillColor:[130,104,75]},
      head:[["Stock por contenedor","Unidades"]], body:Object.entries(byC).map(([k,v])=>[k,fmt(v)]) });
    const byM=aggBy(rows,"mes_compra");
    doc.autoTable({ styles:{fontSize:9}, headStyles:{fillColor:[130,104,75]},
      head:[["Stock por mes de compra","Unidades"]], body:Object.entries(byM).map(([k,v])=>[k,fmt(v)]) });
    const topProd=[...rows].sort((a,b)=>num(b,"stock")-num(a,"stock")).slice(0,12);
    doc.autoTable({ styles:{fontSize:8}, headStyles:{fillColor:[130,104,75]},
      head:[["Top productos por stock","Stock"]], body:topProd.map(r=>[r.nombre,fmt(r.stock)]) });
    doc.save("Mercer_Reportes.pdf"); return;
  }

  // ---- VENTAS: tabla de ventas ----
  if(tab==="ventas"){
    const doc=new jsPDF({orientation:"landscape"});
    const activas=ventas.filter(v=>!v.anulada);
    doc.setFontSize(16); doc.text("MERCER · Ventas",14,15);
    doc.setFontSize(9); doc.text("Generado: "+fecha,14,21);
    doc.autoTable({
      startY:26, styles:{fontSize:7}, headStyles:{fillColor:[130,104,75]},
      head:[["Fecha","Producto","Modelo","Color","Medida","Cant.","P.Unit","Total","Cliente","Vendedora"]],
      body:[...activas].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map(v=>[v.fecha,v.producto,v.modelo,v.color,v.medida,v.cantidad,fmt(v.precio_unitario),fmt(v.importe_total),v.cliente,v.vendedora])
    });
    doc.save("Mercer_Ventas.pdf"); return;
  }

  // ---- VENTAS ANULADAS ----
  if(tab==="anuladas"){
    const doc=new jsPDF({orientation:"landscape"});
    const anul=ventas.filter(v=>v.anulada);
    doc.setFontSize(16); doc.text("MERCER · Ventas Anuladas",14,15);
    doc.setFontSize(9); doc.text("Generado: "+fecha,14,21);
    doc.autoTable({
      startY:26, styles:{fontSize:7}, headStyles:{fillColor:[176,60,60]},
      head:[["Fecha","Producto","Modelo","Cant.","Total","Cliente","Vendedora","Motivo anulación"]],
      body:[...anul].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map(v=>[v.fecha,v.producto,v.modelo,v.cantidad,fmt(v.importe_total),v.cliente,v.vendedora,v.motivo_anulacion||""])
    });
    doc.save("Mercer_Ventas_Anuladas.pdf"); return;
  }

  // ---- DASHBOARD VENTAS: resumen ----
  if(tab==="ventasdash"){
    const doc=new jsPDF();
    const act=ventas.filter(v=>!v.anulada);
    const hoy=new Date().toISOString().slice(0,10), mes=hoy.slice(0,7);
    const fDia=act.filter(v=>v.fecha===hoy).reduce((a,v)=>a+num(v,"importe_total"),0);
    const fMes=act.filter(v=>(v.fecha||"").slice(0,7)===mes).reduce((a,v)=>a+num(v,"importe_total"),0);
    const fTot=act.reduce((a,v)=>a+num(v,"importe_total"),0);
    const uds=act.reduce((a,v)=>a+num(v,"cantidad"),0);
    const ticket=act.length?fTot/act.length:0;
    doc.setFontSize(16); doc.text("MERCER · Dashboard de Ventas",14,15);
    doc.setFontSize(9); doc.text("Generado: "+fecha,14,21);
    doc.autoTable({ startY:26, styles:{fontSize:10}, headStyles:{fillColor:[130,104,75]},
      head:[["Indicador","Valor"]],
      body:[
        ["Ventas del día","US$ "+fmt(fDia)],
        ["Ventas del mes","US$ "+fmt(fMes)],
        ["Facturación total","US$ "+fmt(fTot)],
        ["Productos vendidos",fmt(uds)],
        ["Cantidad de ventas",fmt(act.length)],
        ["Ticket promedio","US$ "+fmt(ticket)],
      ]});
    const rank={}; act.forEach(v=>{const k=v.producto||"(sin)"; rank[k]=(rank[k]||0)+num(v,"cantidad");});
    doc.autoTable({ styles:{fontSize:9}, headStyles:{fillColor:[130,104,75]},
      head:[["Ranking de productos","Unidades"]],
      body:Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>[k,fmt(v)]) });
    const porV={}; act.forEach(v=>{const k=v.vendedora||"(sin)"; porV[k]=(porV[k]||0)+num(v,"importe_total");});
    doc.autoTable({ styles:{fontSize:9}, headStyles:{fillColor:[130,104,75]},
      head:[["Ventas por vendedora","Facturación US$"]],
      body:Object.entries(porV).map(([k,v])=>[k,fmt(v)]) });
    doc.save("Mercer_Dashboard_Ventas.pdf"); return;
  }

  // Fallback
  exportPDFContext("table",{rows,ventas});
}

/* ============================================================
   PANEL AYUDA  (todos los usuarios)
   Envía consultas/sugerencias/errores que se guardan en Supabase
   y aparecen luego en Incidentes del Administrador.
   ============================================================ */
function AyudaPanel({user,onNotify}){
  const isSuper = user.role==="super";
  const [tipo,setTipo]=useState("Consulta");
  const [texto,setTexto]=useState("");
  const [enviando,setEnviando]=useState(false);
  const [mios,setMios]=useState([]);
  const [todos,setTodos]=useState([]);          // todos los mensajes (solo Administrador1)
  const [editId,setEditId]=useState(null);      // mensaje que se está editando
  const [confirmDel,setConfirmDel]=useState(null); // mensaje a eliminar
  const inp=FieldInp;
  const cargarMios=async()=>{
    try{
      const d=await api.list(TABLE_AYUDA);
      const ordenados=(d||[]).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
      setMios(ordenados.filter(x=>x.usuario===user.name).slice(0,10));
      if(isSuper) setTodos(ordenados);           // Administrador1 ve todos
    }catch(e){}
  };
  useEffect(()=>{ cargarMios(); },[]);
  const cambiarEstado=async(m,estado)=>{
    try{ await api.update(m.id,{estado},TABLE_AYUDA); setTodos(as=>as.map(x=>x.id===m.id?{...x,estado}:x)); setMios(as=>as.map(x=>x.id===m.id?{...x,estado}:x)); onNotify("Estado actualizado"); }catch(e){}
  };
  const enviar=async()=>{
    if(!texto.trim()){ onNotify("Escribí tu mensaje antes de enviar","warn"); return; }
    setEnviando(true);
    try{
      if(editId){
        await api.update(editId,{ tipo, comentario:texto.trim() }, TABLE_AYUDA);
        onNotify("Mensaje actualizado");
        setEditId(null);
      } else {
        await api.create({ fecha:new Date().toISOString(), usuario:user.name, tipo, comentario:texto.trim(), estado:"Pendiente" }, TABLE_AYUDA);
        await logEvent("ayuda", `${tipo}: ${texto.trim().slice(0,60)}`,"info");
        onNotify("¡Gracias! Tu mensaje fue enviado");
      }
      setTexto(""); cargarMios();
    }catch(e){ onNotify("No se pudo enviar: "+e.message,"error"); }
    setEnviando(false);
  };
  const editar=(m)=>{ setEditId(m.id); setTipo(m.tipo||"Consulta"); setTexto(m.comentario||""); };
  const cancelarEdit=()=>{ setEditId(null); setTexto(""); setTipo("Consulta"); };
  const eliminar=async()=>{
    if(!confirmDel) return;
    try{ await api.remove(confirmDel.id,TABLE_AYUDA); onNotify("Mensaje eliminado","warn"); cargarMios(); }
    catch(e){ onNotify("No se pudo eliminar: "+e.message,"error"); }
    setConfirmDel(null);
  };
  const badge=(estado)=>"px-2 py-0.5 rounded-full text-xs font-medium h-fit whitespace-nowrap "+(estado==="Resuelto"?"bg-emerald-100 text-emerald-800":estado==="En revisión"?"bg-amber-100 text-amber-800":"bg-sand-100 text-sand-700");
  return (
    <div className={"fade "+(isSuper?"max-w-4xl":"max-w-2xl")}>
      <h3 className="font-serif text-2xl text-ink mb-1">Ayuda y sugerencias</h3>
      <p className="text-sm text-sand-600 mb-5">Envianos una consulta, sugerencia, solicitud o reporte de error. El administrador lo recibe y le da seguimiento.</p>
      <div className="bg-white rounded-2xl p-5 border border-sand-200 shadow-sm space-y-4 max-w-2xl">
        <Field label="Tipo de mensaje">
          <select className={inp} value={tipo} onChange={e=>setTipo(e.target.value)}>
            <option>Consulta</option><option>Sugerencia</option><option>Solicitud</option><option>Reporte de error</option>
          </select>
        </Field>
        <Field label="Mensaje">
          <textarea className={inp} rows="4" value={texto} onChange={e=>setTexto(e.target.value)} placeholder="Escribí acá tu mensaje…"/>
        </Field>
        <div className="flex justify-end gap-2">
          {editId && <button onClick={cancelarEdit} className="px-5 py-2.5 rounded-xl border border-sand-300 text-sand-700 hover:bg-sand-100">Cancelar</button>}
          <button onClick={enviar} disabled={enviando} className="px-6 py-2.5 rounded-xl bg-ink text-white hover:bg-sand-900 font-semibold disabled:opacity-50">{enviando?"Guardando…":(editId?"Guardar cambios":"Enviar")}</button>
        </div>
      </div>

      {mios.length>0 && (
        <div className="mt-6 max-w-2xl">
          <h4 className="font-serif text-lg text-ink mb-3">Tus últimos mensajes</h4>
          <div className="space-y-2">
            {mios.map(m=>(
              <div key={m.id} className={"bg-white rounded-xl p-3 border text-sm flex justify-between gap-3 "+(editId===m.id?"border-amber-300 bg-amber-50":"border-sand-200")}>
                <div className="flex-1"><span className="text-xs text-sand-500">{(m.fecha||"").slice(0,10)} · {m.tipo}</span><div className="text-ink">{m.comentario}</div></div>
                <div className="flex items-start gap-1">
                  <span className={badge(m.estado)}>{m.estado}</span>
                  <button onClick={()=>editar(m)} className="text-sand-600 hover:text-ink px-1" title="Editar">✏️</button>
                  <button onClick={()=>setConfirmDel(m)} className="text-red-500 hover:text-red-700 px-1" title="Eliminar">🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Administrador1: todos los mensajes de todos los usuarios */}
      {isSuper && (
        <div className="mt-8">
          <h4 className="font-serif text-lg text-ink mb-1">Mensajes de todos los usuarios</h4>
          <p className="text-xs text-sand-500 mb-3">Gestioná el estado de cada mensaje. Pendiente → En revisión → Resuelto.</p>
          <div className="bg-white rounded-2xl border border-sand-200 shadow-sm overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-sand-100 border-b border-sand-200"><tr>
                {["Fecha","Usuario","Tipo","Mensaje","Estado","Acción"].map(h=><th key={h} className="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wider text-sand-600 whitespace-nowrap">{h}</th>)}
              </tr></thead>
              <tbody>
                {todos.length===0 ? <tr><td colSpan="6" className="text-center py-8 text-sand-500">No hay mensajes</td></tr> :
                 todos.map(m=>(
                  <tr key={m.id} className="border-b border-sand-100 hover:bg-sand-50">
                    <td className="px-3 py-2 whitespace-nowrap text-xs text-sand-600">{(m.fecha||"").slice(0,10)}</td>
                    <td className="px-3 py-2 whitespace-nowrap">{m.usuario}</td>
                    <td className="px-3 py-2 whitespace-nowrap">{m.tipo}</td>
                    <td className="px-3 py-2">{m.comentario}</td>
                    <td className="px-3 py-2"><span className={badge(m.estado)}>{m.estado}</span></td>
                    <td className="px-3 py-2 whitespace-nowrap">
                      <select className="text-xs border border-sand-300 rounded-lg px-2 py-1 bg-white" value={m.estado} onChange={e=>cambiarEstado(m,e.target.value)}>
                        <option>Pendiente</option><option>En revisión</option><option>Resuelto</option>
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {confirmDel && (
        <Modal title="Eliminar mensaje" onClose={()=>setConfirmDel(null)}>
          <p className="text-sm text-ink mb-4">¿Seguro que querés eliminar este mensaje? Esta acción no se puede deshacer.</p>
          <div className="flex gap-3 justify-end">
            <button onClick={()=>setConfirmDel(null)} className="px-4 py-2 rounded-xl border border-sand-300 text-sm hover:bg-sand-100">Cancelar</button>
            <button onClick={eliminar} className="px-4 py-2 rounded-xl bg-red-600 text-white text-sm font-semibold hover:bg-red-700">Eliminar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================================================
   HEALTH CHECK  (solo Administrador1)  — solo lectura
   ============================================================ */
function HealthPanel({rows,ventas,cloud}){
  const [check,setCheck]=useState(null);
  const [cargando,setCargando]=useState(false);
  const correr=async()=>{
    setCargando(true);
    const t0=performance.now();
    let dbOk=false, err=null, nProd=0, nVent=0, nLogs=0, nAyuda=0;
    try{
      const prod=await api.list(TABLE);      nProd=(prod||[]).length; dbOk=true;
      const vts=await api.list(TABLE_V);      nVent=(vts||[]).length;
      try{ nLogs=(await api.list(TABLE_LOGS)||[]).length; }catch(e){}
      try{ nAyuda=(await api.list(TABLE_AYUDA)||[]).length; }catch(e){}
    }catch(e){ err=e.message; dbOk=false; }
    const ms=Math.round(performance.now()-t0);
    setCheck({ ts:new Date().toLocaleString("es-AR"), ms, dbOk, err, nProd, nVent, nLogs, nAyuda,
               modo: cloud?"Nube (Supabase)":"Local", vendidas:(ventas||[]).filter(v=>!v.anulada).length });
    setCargando(false);
  };

          <h3 className="font-serif text-2xl text-ink mb-1">Health Check</h3>

      </div>
      {check && (
        <>
          <div className={"rounded-2xl p-5 mb-5 text-white "+(check.dbOk?"bg-emerald-700":"bg-red-600")}>
            <div className="text-lg font-semibold">{check.dbOk?"🟢 Conexión correcta con la base de datos":"🔴 Sin conexión con la base de datos"}</div>
            <div className="text-sm opacity-90 mt-1">Último chequeo: {check.ts} · Tiempo de respuesta: {check.ms} ms · Modo: {check.modo}</div>
            {check.err && <div className="text-sm mt-2 bg-white/20 rounded-lg px-3 py-2">Error: {check.err}</div>}
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <Item label="Estado base de datos" value={check.dbOk?"Operativa":"Caída"} ok={check.dbOk}/>
            <Item label="Tiempo de respuesta" value={check.ms+" ms"} ok={check.ms<2000}/>
            <Item label="Errores de conexión" value={check.err?"Sí":"No"} ok={!check.err}/>
            <Item label="Productos" value={fmt(check.nProd)}/>
            <Item label="Ventas registradas" value={fmt(check.nVent)}/>
            <Item label="Ventas activas" value={fmt(check.vendidas)}/>
            <Item label="Mensajes de ayuda" value={fmt(check.nAyuda)}/>
            <Item label="Eventos en log" value={fmt(check.nLogs)}/>
            <Item label="Compras (productos cargados)" value={fmt(check.nProd)}/>
          </div>
        </>
      )}
    </div>
  );
}
